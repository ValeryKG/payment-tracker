<!-- ==========================================================
BUILDING PAYMENT TRACKER - ADMIN PANEL (FINALIZED AUTH STANDARD)
Author: Valery Lavrov
Purpose: Full administrative control for creating and managing
buildings, assigning managers, and handling Tier 1 Firebase configs.
Tier: 1 (baiti-f1bb5)
Last Updated: 2025-11-12

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Building Payment Tracker</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background-color: #f9fafb;
      min-height: 100vh;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    // ============================================================
    // 🔐 Firebase Initialization (Tier 1 - Dashboard)
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyA0ZH1t5TCaQEtU8FxgnjQP4X2JfJlgX08",
      authDomain: "baiti-f1bb5.firebaseapp.com",
      databaseURL: "https://baiti-f1bb5-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "baiti-f1bb5",
      storageBucket: "baiti-f1bb5.firebasestorage.app",
      messagingSenderId: "395782765837",
      appId: "1:395782765837:web:0775960f26a558d3e5c444"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // ============================================================
    // 🧩 Logging Helper
    // ============================================================
    function log(label, message, type = 'info') {
      const colors = { info: 'color:#00aaff', warn: 'color:#ffaa00', error: 'color:#ff5555' };
      console.log(`%c[${label}]`, colors[type] || '', message);
    }

    // ============================================================
    // 👤 Authentication Standard Implementation
    // ============================================================
    async function ensurePersistence() {
      try {
        await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
        log('AUTH', 'Persistence set to LOCAL', 'info');
      } catch (err) {
        log('AUTH', 'Failed to set persistence: ' + err.message, 'warn');
      }
    }

    ensurePersistence();

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        log('AUTH', 'User not logged in → redirecting to index.html', 'warn');
        window.location.href = 'index.html';
        return;
      }

      try {
        const userRef = db.ref('users/' + user.uid);
        const snapshot = await userRef.once('value');
        const userData = snapshot.val();

        if (!userData || userData.role !== 'admin') {
          alert('Access denied. Admin only.');
          log('AUTH', 'Unauthorized user tried to access admin page', 'error');
          window.location.href = 'index.html';
          return;
        }

        log('AUTH', `Admin authenticated successfully: ${user.email}`, 'info');
        renderAdminPanel(user);
      } catch (err) {
        log('AUTH', 'Error verifying user: ' + err.message, 'error');
        alert('Error verifying user. Please try again.');
        window.location.href = 'index.html';
      }
    });

    // ============================================================
    // 🏢 Render Admin Panel
    // ============================================================
    function renderAdminPanel(user) {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="max-w-7xl mx-auto p-6">
          <!-- Header -->
          <div class="bg-white shadow rounded-lg p-6 mb-6">
            <div class="flex justify-between items-center">
              <div>
                <h1 class="text-3xl font-bold text-gray-800">Admin Panel</h1>
                <p class="text-gray-600">Logged in as: ${user.email}</p>
              </div>
              <button onclick="firebase.auth().signOut().then(() => window.location.href='index.html')" 
                class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded">
                Logout
              </button>
            </div>
          </div>

          <!-- Create New Building -->
          <div class="bg-white shadow rounded-lg p-6 mb-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Create New Building</h2>
            <form id="createBuildingForm" class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Building Name *</label>
                <input type="text" id="buildingName" required class="input" placeholder="e.g. Demo Building 1">
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Address *</label>
                <input type="text" id="address" required class="input" placeholder="e.g. 123 Demo St, Tel Aviv">
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Apartment Count *</label>
                <input type="number" id="apartmentCount" required min="1" max="100" value="16" class="input">
                <p class="text-sm text-gray-500 mt-1">Enter number of apartments (1–100)</p>
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">Region</label>
                  <input type="text" id="region" class="input" placeholder="Tel Aviv">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">City</label>
                  <input type="text" id="city" class="input" placeholder="Tel Aviv">
                </div>
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Firebase Project ID *</label>
                <input type="text" id="firebaseProjectId" required class="input" placeholder="e.g. demo1-payment">
                <p class="text-sm text-gray-500 mt-1">Format: buildingname-payment</p>
              </div>

              <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-6 rounded-lg">
                Create Building
              </button>
            </form>
          </div>

          <!-- Existing Buildings (Already in your original structure) -->
          <div class="bg-white shadow rounded-lg p-6 mb-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Existing Buildings</h2>
            <div id="buildingsList" class="space-y-3 text-gray-700">
              <p>Loading buildings...</p>
            </div>
          </div>
        </div>
      `;

      loadBuildings();
    }

    // ============================================================
    // 🗂 Load Buildings List (unchanged logic)
    // ============================================================
    function loadBuildings() {
      const listRef = db.ref('buildingConfigs');
      const container = document.getElementById('buildingsList');

      listRef.on('value', (snapshot) => {
        const buildings = snapshot.val();

        if (!buildings) {
          container.innerHTML = '<p class="text-gray-500">No buildings found.</p>';
          return;
        }

        container.innerHTML = Object.entries(buildings).map(([id, b]) => `
          <div class="border border-gray-200 rounded-lg p-4 flex justify-between items-center hover:bg-gray-50">
            <div>
              <h3 class="text-lg font-semibold text-gray-800">${b.buildingName || id}</h3>
              <p class="text-sm text-gray-600">${b.city || ''} • ${b.region || ''}</p>
            </div>
            <button onclick="window.location.href='building.html?id=${id}'" 
              class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">
              Open
            </button>
          </div>
        `).join('');

        log('DB', `Loaded ${Object.keys(buildings).length} buildings.`, 'info');
      }, (err) => {
        log('DB', 'Error loading buildings: ' + err.message, 'error');
        container.innerHTML = '<p class="text-red-500">Error loading buildings.</p>';
      });
    }

    // ============================================================
    // 🧱 Input Field Styling (Reusable)
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
      const style = document.createElement('style');
      style.innerHTML = `
        .input {
          width: 100%;
          padding: 0.5rem 1rem;
          border: 1px solid #d1d5db;
          border-radius: 0.5rem;
          outline: none;
          transition: box-shadow 0.2s;
        }
        .input:focus {
          border-color: #22c55e;
          box-shadow: 0 0 0 2px #bbf7d0;
        }
      `;
      document.head.appendChild(style);
    });
  </script>
</body>

</html>
