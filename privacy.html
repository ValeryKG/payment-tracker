                                <h1 class="text-3xl sm:text-4xl font-bold text-slate-800 mb-2">${t.title}</h1>

                                <p class="text-sm text-slate-500 mt-2">${t.lastUpdated}</p>
                            </div>
                            <button onclick="toggleLanguage()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition-colors">
                                ${t.switchLang}
                            </button>
                        </div>
                        
                        <!-- GDPR Compliance Badge -->
                        <div class="bg-blue-50 border-2 border-blue-500 rounded-lg p-4 mb-6">
                            <p class="text-blue-900 font-bold text-center">
                                🛡️ GDPR Compliant - Data Stored in EU (Belgium)
                            </p>
                            <p class="text-blue-800 text-sm text-center mt-1">
                                Protected under Israeli Privacy Protection Law & GDPR
                            </p>
                        </div>
                        
                        <!-- Sections -->
                        ${t.sections.map(section => `
                            <div class="mb-8">
                                <h2 class="text-xl sm:text-2xl font-bold text-slate-800 mb-3">${section.title}</h2>
                                <div class="text-slate-700 leading-relaxed whitespace-pre-line">${section.content}</div>
                            </div>
                        `).join('')}
                        
                        <!-- Back Button -->
                        <div class="mt-8 pt-6 border-t border-slate-200">
                            <a href="index.html" class="inline-block px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors">
                                ${t.backButton}
                            </a>
                        </div>
                    </div>
                    
                    <!-- Footer -->
                    <div class="text-center text-xs text-slate-500 mb-8">
                        <p>© 2025 Valery Lavrov. All Rights Reserved.</p>
                        <p class="mt-1">Your privacy is protected by law. Contact us for any concerns.</p>
                    </div>
                </div>
            `;
        }
        
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'he' : 'en';
            render();
        }
        
        // Initial render
        render();
    </script>
</body>
</html>
