            const getCurrentMonthKey = () => {
                const year = currentDate.getFullYear();
                const month = String(currentDate.getMonth() + 1).padStart(2, '0');
                return `${year}-${month}`;
            };

            const formatMonthYear = (dateStr) => {
                const [year, month] = dateStr.split('-');
                const date = new Date(year, parseInt(month) - 1);
                const locale = language === 'he' ? 'he-IL' : language === 'ru' ? 'ru-RU' : 'en-US';
                return date.toLocaleDateString(locale, {
                    month: 'long',
                    year: 'numeric'
                });
            };

            const changeMonth = (direction) => {
                const newDate = new Date(currentDate);
                newDate.setMonth(newDate.getMonth() + direction);
                setCurrentDate(newDate);

                const newMonthKey = `${newDate.getFullYear()}-${String(newDate.getMonth() + 1).padStart(2, '0')}`;

                // Ensure month data exists in Firebase (create full apartments list if missing)
                const monthRef = database.ref(`buildingData/monthlyBills/${newMonthKey}`);
                monthRef.once('value', (snapshot) => {
                    if (!snapshot.exists()) {
                        monthRef.set({
                            amount: monthlySettings.amount || 150,
                            dueDay: monthlySettings.dueDay || 5,
                            apartments: Object.fromEntries([...Array(getApartmentCount())].map((_, i) => [i + 1, { paid: false }]))
                        }).catch(err => console.error('Error creating month in DB:', err));
                    }
                }, (err) => {
                    console.error('Error checking month in DB:', err);
                });
            };

            const getDaysUntilDue = (dueDay) => {
                const today = new Date();
                const dueDate = new Date(today.getFullYear(), today.getMonth(), dueDay);
                const diffTime = dueDate - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                return diffDays;

                        metadata: metadata,
                        dataSnapshot: {

                            users: usersData
                        }

                    // Cleanup old backups (keep last 50)
                    await cleanupOldBackups();

                    console.log(`✅ Backup created: ${triggerType}`);
                    return true;

                    const snapshot = await backupsRef.once('value');

                    // Convert to array and sort by timestamp (oldest first)
                    const backupArray = Object.entries(backups).map(([key, data]) => ({
                        key,
                        timestamp: data.timestamp
                    }));

                    backupArray.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

                    // If more than 50, delete oldest ones
                    if (backupArray.length > 50) {
                        const toDelete = backupArray.slice(0, backupArray.length - 50);
                        for (let backup of toDelete) {
                            await database.ref(`supportBackups/${backup.key}`).remove();
                        }
                        console.log(`🗑️ Cleaned up ${toDelete.length} old backups`);
                    }
                } catch (error) {
                    console.error('Cleanup error:', error);
                }
            };

                    const dayOfWeek = now.getDay(); // 0 = Sunday, 1 = Monday, etc.

                    const lastMonthlyBackup = localStorage.getItem('lastMonthlyBackup');

                    const today = now.toISOString().split('T')[0]; // YYYY-MM-DD

                    // Weekly backup (every Sunday)
                    if (dayOfWeek === 0 && lastWeeklyBackup !== today) {
                        await createBackup('weekly_auto', { day: 'Sunday' });
                        localStorage.setItem('lastWeeklyBackup', today);
                    }

                    // Monthly backup (1st of month)
                    if (dayOfMonth === 1 && lastMonthlyBackup !== today) {
                        await createBackup('monthly_auto', { month: now.toLocaleString('en-US', { month: 'long', year: 'numeric' }) });
                        localStorage.setItem('lastMonthlyBackup', today);

                                                    </p>
                                                    <p className="text-red-800 text-xs text-center mt-1">
                                                        {language === 'he'
                                                            ? 'תוכנה קניינית - מוגנת על פי חוק'
                                                            : 'Proprietary Software - Protected by Law'}
                                                    </p>
                                                </div>

                                                {/* Checkboxes */}
                                                <div className="space-y-4 mb-6">
                                                    {/* Terms of Service */}
                                                    <div className="flex items-start gap-3 p-4 bg-slate-50 rounded-lg border border-slate-300">
                                                        <input
                                                            type="checkbox"
                                                            id="agree-terms"
                                                            checked={agreementChecks.terms}
                                                            onChange={(e) => setAgreementChecks({ ...agreementChecks, terms: e.target.checked })}
                                                            className="mt-1 w-5 h-5 cursor-pointer"
                                                        />
                                                        <label htmlFor="agree-terms" className="flex-1 cursor-pointer">
                                                            <span className="font-semibold text-slate-800">
                                                                {language === 'he'
                                                                    ? 'אני מסכים לתנאי השימוש'
                                                                    : 'I agree to the Terms of Service'}
                                                            </span>
                                                            <a
                                                                href="terms.html"
                                                                target="_blank"
                                                                className="text-blue-600 hover:text-blue-700 underline text-sm block mt-1"
                                                            >
                                                                {language === 'he' ? '📄 קרא תנאי שימוש' : '📄 Read Terms'}
                                                            </a>
                                                        </label>
                                                    </div>

                                                    {/* Privacy Policy */}
                                                    <div className="flex items-start gap-3 p-4 bg-slate-50 rounded-lg border border-slate-300">
                                                        <input
                                                            type="checkbox"
                                                            id="agree-privacy"
                                                            checked={agreementChecks.privacy}
                                                            onChange={(e) => setAgreementChecks({ ...agreementChecks, privacy: e.target.checked })}
                                                            className="mt-1 w-5 h-5 cursor-pointer"
                                                        />
                                                        <label htmlFor="agree-privacy" className="flex-1 cursor-pointer">
                                                            <span className="font-semibold text-slate-800">
                                                                {language === 'he'
                                                                    ? 'אני מסכים למדיניות הפרטיות'
                                                                    : 'I agree to the Privacy Policy'}
                                                            </span>
                                                            <a
                                                                href="privacy.html"
                                                                target="_blank"
                                                                className="text-blue-600 hover:text-blue-700 underline text-sm block mt-1"
                                                            >
                                                                {language === 'he' ? '🔒 קרא מדיניות פרטיות' : '🔒 Read Privacy Policy'}
                                                            </a>
                                                        </label>
                                                    </div>

                                                    {/* Authorization - Manager/Admin Only */}
                                                    {(userRole === 'admin' || userRole === 'manager') && (
                                                        <div className="flex items-start gap-3 p-4 bg-blue-50 rounded-lg border border-blue-300">
                                                            <input
                                                                type="checkbox"
                                                                id="agree-authorized"
                                                                checked={agreementChecks.authorized}
                                                                onChange={(e) => setAgreementChecks({ ...agreementChecks, authorized: e.target.checked })}
                                                                className="mt-1 w-5 h-5 cursor-pointer"
                                                            />
                                                            <label htmlFor="agree-authorized" className="flex-1 cursor-pointer">
                                                                <span className="font-semibold text-slate-800">
                                                                    {language === 'he'
                                                                        ? 'אני מורשה להשתמש במערכת זו'
                                                                        : 'I am authorized to use this system'}
                                                                </span>
                                                                <p className="text-xs text-slate-600 mt-1">
                                                                    {language === 'he'
                                                                        ? 'אני מאשר שיש לי הרשאה מבעל הבניין לנהל רישומי תשלומים'
                                                                        : 'I confirm I have permission from the building owner to manage payment records'}
                                                                </p>
                                                            </label>
                                                        </div>
                                                    )}
                                                </div>

                                                {/* Buttons */}
                                                <div className="flex gap-3">
                                                    <button
                                                        onClick={handleAcceptAgreement}
                                                        className="flex-1 px-6 py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg font-bold text-lg transition-colors"
                                                    >
                                                        {language === 'he' ? '✓ אני מסכים והמשך' : '✓ I Accept & Continue'}
                                                    </button>
                                                    <button
                                                        onClick={handleDeclineAgreement}
                                                        className="flex-1 px-6 py-3 bg-red-600 hover:bg-red-700 text-white rounded-lg font-bold text-lg transition-colors"
                                                    >
                                                        {language === 'he' ? '✕ דחה' : '✕ Decline'}
                                                    </button>
                                                </div>

                                                {/* Warning */}
                                                <p className="text-xs text-center text-slate-500 mt-4">
                                                    {language === 'he'
                                                        ? 'לחיצה על "דחה" תנתק אותך מהמערכת'
                                                        : 'Clicking "Decline" will log you out of the system'}
                                                </p>
                                            </div>
                                        </div>
                                    )
                                }

                                {/* Payment Links Settings Modal */}
                                {
                                    showPaymentLinksSettings && (
                                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4 overflow-y-auto">
                                            <div className="bg-white rounded-lg p-4 sm:p-6 w-full max-w-2xl my-8">
                                                <div className="flex justify-between items-center mb-4">
                                                    <h3 className="text-lg sm:text-xl font-bold">💳 {t.paymentLinksSettings}</h3>
                                                    <button onClick={() => setShowPaymentLinksSettings(false)} className="p-2 hover:bg-slate-100 rounded-lg">
                                                        <XCircle size={24} />
                                                    </button>
                                                </div>

                                                <div className="mb-4 p-3 bg-blue-50 border border-blue-200 rounded-lg">
                                                    <p className="text-sm text-blue-800">
                                                        ℹ️ {t.paymentLinksHelp}
                                                    </p>
                                                </div>

                                                <div className="space-y-4">
                                                    {/* Bit Link */}
                                                    <div>
                                                        <label className="block text-sm font-medium text-slate-700 mb-1">
                                                            💰 {t.bitPaymentLink}
                                                        </label>
                                                        <input
                                                            type="url"
                                                            value={paymentLinksData.bitLink}
                                                            onChange={(e) => setPaymentLinksData({ ...paymentLinksData, bitLink: e.target.value })}
                                                            className="w-full px-4 py-3 border border-slate-300 rounded-lg text-base"
                                                            placeholder="https://bit.ly/payment/building123"
                                                            dir="ltr"
                                                        />
                                                        <p className="text-xs text-slate-500 mt-1">
                                                            Paste your Bit payment link here
                                                        </p>
                                                    </div>

                                                    {/* Bank Details */}
                                                    <div>
                                                        <label className="block text-sm font-medium text-slate-700 mb-1">
                                                            🏦 {t.bankTransferDetails}
                                                        </label>
                                                        <textarea
                                                            value={paymentLinksData.bankDetails}
                                                            onChange={(e) => setPaymentLinksData({ ...paymentLinksData, bankDetails: e.target.value })}
                                                            className="w-full px-4 py-3 border border-slate-300 rounded-lg text-base"
                                                            rows="3"
                                                            placeholder="Bank: Leumi&#10;Account: 12345678&#10;Branch: 900"
                                                            dir={language === 'he' ? 'rtl' : 'ltr'}
                                                        />
                                                        <p className="text-xs text-slate-500 mt-1">
                                                            Add bank account details for transfers
                                                        </p>
                                                    </div>

                                                    {/* Other Payment */}
                                                    <div>
                                                        <label className="block text-sm font-medium text-slate-700 mb-1">
                                                            💳 {t.otherPaymentMethod}
                                                        </label>
                                                        <input
                                                            type="url"
                                                            value={paymentLinksData.otherPaymentLink}
                                                            onChange={(e) => setPaymentLinksData({ ...paymentLinksData, otherPaymentLink: e.target.value })}
                                                            className="w-full px-4 py-3 border border-slate-300 rounded-lg text-base"
                                                            placeholder="https://paypal.me/building123"
                                                            dir="ltr"
                                                        />
                                                        <p className="text-xs text-slate-500 mt-1">
                                                            PayPal, Stripe, or other payment link
                                                        </p>
                                                    </div>

                                                    {/* WhatsApp Group */}
                                                    <div>
                                                        <label className="block text-sm font-medium text-slate-700 mb-1">
                                                            💬 {t.whatsappGroup}
                                                        </label>
                                                        <input
                                                            type="url"
                                                            value={paymentLinksData.whatsappGroupLink}
                                                            onChange={(e) => setPaymentLinksData({ ...paymentLinksData, whatsappGroupLink: e.target.value })}
                                                            className="w-full px-4 py-3 border border-slate-300 rounded-lg text-base"
                                                            placeholder="https://chat.whatsapp.com/ABC123XYZ"
                                                            dir="ltr"
                                                        />
                                                        <p className="text-xs text-slate-500 mt-1">
                                                            Building residents WhatsApp group invite link
                                                        </p>
                                                    </div>
                                                </div>

                                                {/* Action Buttons */}
                                                <div className="flex gap-2 mt-6">
                                                    <button
                                                        onClick={async () => {
                                                            try {
                                                                await database.ref('buildingData/buildingSettings/paymentLinks').set(paymentLinksData);
                                                                alert('✅ Payment links saved successfully!');
                                                                setShowPaymentLinksSettings(false);
                                                            } catch (error) {
                                                                console.error('Error saving links:', error);
                                                                alert('❌ Error: ' + error.message);
                                                            }
                                                        }}
                                                        className="flex-1 px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium flex items-center justify-center gap-2 transition-colors"
                                                    >
                                                        <Save size={18} />
                                                        {t.save}
                                                    </button>
                                                    <button
                                                        onClick={() => setShowPaymentLinksSettings(false)}
                                                        className="flex-1 px-4 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg font-medium transition-colors"
                                                    >
                                                        {t.cancel}
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    )
                                }


                                {/* Monthly Bills Section */}
                                <div className="bg-white rounded-lg shadow-lg p-3 sm:p-6 mb-4 sm:mb-6">
                                    <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-4 gap-2">
                                        <h2 className="text-xl sm:text-2xl font-bold text-slate-800">{t.monthlyBills}</h2>
                                        {daysUntilDue < 0 ? (
                                            <div className="flex items-center gap-2 text-red-600 font-semibold text-sm sm:text-base">
                                                <AlertCircle size={18} />
                                                {Math.abs(daysUntilDue)} {t.daysOverdue}
                                            </div>
                                        ) : daysUntilDue <= 3 ? (
                                            <div className="flex items-center gap-2 text-orange-600 font-semibold text-sm sm:text-base">
                                                <Clock size={18} />
                                                {daysUntilDue} {t.daysUntilDue}
                                            </div>
                                        ) : null}
                                    </div>

                                    <div className="mb-4 sm:mb-6">
                                        <div className="flex justify-between items-center mb-2 text-xs sm:text-sm">
                                            <span className="font-medium text-slate-600">
                                                {t.progress}: {monthlyProgress.paid}/{monthlyProgress.total} ({monthlyProgress.percentage}%)
                                            </span>
                                            <span className="font-medium text-slate-600">
                                                NIS {isNaN(monthlyProgress.paid * (currentMonthData.amount || monthlySettings.amount)) ? 0 : monthlyProgress.paid * (currentMonthData.amount || monthlySettings.amount)} /
                                                NIS {isNaN(monthlyProgress.total * (currentMonthData.amount || monthlySettings.amount)) ? 0 : monthlyProgress.total * (currentMonthData.amount || monthlySettings.amount)}
                                            </span>

                                        </div>
                                        <div className="h-3 bg-slate-200 rounded-full overflow-hidden">
                                            <div
                                                className="h-full bg-gradient-to-r from-green-500 to-green-600 transition-all duration-500"
                                                style={{ width: `${monthlyProgress.percentage}%` }}
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-2 sm:gap-3">
                                        {currentMonthData.apartments && Object.entries(currentMonthData.apartments).map(([num, apt]) => {
                                            const canSee = canSeePaymentStatus(num, viewerApt);
                                            const isPaid = apt.paid;

                                            return (
                                                <div
                                                    key={num}
                                                    onClick={() => isAuthenticated && userRole !== 'resident' && togglePaymentStatus('monthly', null, num)}
                                                    className={`p-3 sm:p-4 rounded-lg border-2 transition-all touch-manipulation ${canSee
                                                        ? (isPaid
                                                            ? 'bg-green-50 border-green-500 active:bg-green-100'
                                                            : daysUntilDue < 0
                                                                ? 'bg-red-50 border-red-500 active:bg-red-100'
                                                                : 'bg-slate-50 border-slate-300 active:bg-slate-100')
                                                        : 'bg-slate-100 border-slate-400'
                                                        } ${isAuthenticated && userRole !== 'resident' ? 'cursor-pointer' : ''}`}
                                                >
                                                    <div className="text-center">
                                                        <div className="text-base sm:text-lg font-bold text-slate-700 mb-1 sm:mb-2">
                                                            {t.apartment} {num}
                                                        </div>

                                                        {canSee ? (
                                                            <>
                                                                <div className="flex justify-center mb-1 sm:mb-2">
                                                                    {isPaid ? (
                                                                        <Check size={20} className="text-green-600" />
                                                                    ) : daysUntilDue < 0 ? (
                                                                        <X size={20} className="text-red-600" />
                                                                    ) : (
                                                                        <Clock size={20} className="text-orange-500" />
                                                                    )}
                                                                </div>
                                                                <div className={`text-xs font-semibold ${isPaid ? 'text-green-700' : daysUntilDue < 0 ? 'text-red-700' : 'text-orange-600'
                                                                    }`}>
                                                                    {isPaid ? t.paid : daysUntilDue < 0 ? t.overdue : t.unpaid}
                                                                </div>
                                                                {isPaid && apt.date && (
                                                                    <div className="text-xs text-slate-500 mt-1">
                                                                        {new Date(apt.date).toLocaleDateString(language === 'he' ? 'he-IL' : 'en-US', {
                                                                            month: 'short',
                                                                            day: 'numeric'
                                                                        })}
                                                                    </div>
                                                                )}
                                                                <div className="text-xs sm:text-sm font-semibold text-slate-600 mt-1">
                                                                    NIS {apt.amount || currentMonthData.amount}
                                                                </div>
                                                            </>
                                                        ) : (
                                                            <>
                                                                <div className="flex justify-center mb-1 sm:mb-2">
                                                                    <Lock size={20} className="text-slate-400" />
                                                                </div>
                                                                <div className="text-xs font-semibold text-slate-500">
                                                                    🔒 {t.privateStatus}
                                                                </div>
                                                            </>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* Special Projects */}
                                {
                                    data.projectsWithKeys && data.projectsWithKeys.length > 0 && data.projectsWithKeys.map(project => {
                                        const projectProgress = calculateProgress(project.apartments);
                                        const projectDaysUntil = getProjectDaysUntilDue(project.dueDate);
                                        const projectPushKey = project.pushKey;  // NEW: From attached key

                                        return (
                                            <div key={projectPushKey} className="bg-white rounded-lg shadow-lg p-3 sm:p-6 mb-4 sm:mb-6">
                                                <div className="mb-4">
                                                    <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-2 gap-2">
                                                        <div className="flex-1">
                                                            <div className="flex items-center gap-2">
                                                                <h2 className="text-xl sm:text-2xl font-bold text-slate-800">
                                                                    {language === 'he' ? project.nameHe : project.name}
                                                                </h2>
                                                                {isAuthenticated && (
                                                                    <button
                                                                        onClick={() => handleDeleteProject(projectPushKey)}  // CHANGED: Pass pushKey
                                                                        className="p-1 hover:bg-red-100 rounded text-red-600 touch-manipulation"
                                                                    >
                                                                        <Trash2 size={18} />
                                                                    </button>
                                                                )}
                                                            </div>
                                                        </div>
                                                        {projectDaysUntil < 0 ? (
                                                            <div className="flex items-center gap-2 text-red-600 font-semibold text-sm sm:text-base">
                                                                <AlertCircle size={18} />
                                                                {Math.abs(projectDaysUntil)} {t.daysOverdue}
                                                            </div>
                                                        ) : projectDaysUntil <= 7 ? (
                                                            <div className="flex items-center gap-2 text-orange-600 font-semibold text-sm sm:text-base">
                                                                <Clock size={18} />
                                                                {projectDaysUntil} {t.daysUntilDue}
                                                            </div>
                                                        ) : null}
                                                    </div>
                                                    <p className="text-sm sm:text-base text-slate-600 mb-2">
                                                        {language === 'he' ? project.descriptionHe : project.description}
                                                    </p>
                                                    <div className="flex flex-wrap gap-2 sm:gap-4 text-xs sm:text-sm">
                                                        <span className="text-slate-600">
                                                            <strong>{t.total}:</strong> NIS {project.total.toLocaleString()}
                                                        </span>
                                                        <span className="text-slate-600">
                                                            <strong>NIS {project.perApartment}</strong> {t.perApartment}
                                                        </span>
                                                        <span className="text-slate-600">
                                                            <strong>{t.dueDate}:</strong> {new Date(project.dueDate).toLocaleDateString(language === 'he' ? 'he-IL' : 'en-US')}
                                                        </span>
                                                    </div>
                                                </div>

                                                <div className="mb-4 sm:mb-6">
                                                    <div className="flex justify-between items-center mb-2 text-xs sm:text-sm">
                                                        <span className="font-medium text-slate-600">
                                                            {t.progress}: {projectProgress.paid}/{projectProgress.total} ({projectProgress.percentage}%)
                                                        </span>
                                                        <span className="font-medium text-slate-600">
                                                            NIS {(projectProgress.paid * project.perApartment).toLocaleString()} / NIS {project.total.toLocaleString()}
                                                        </span>
                                                    </div>
                                                    <div className="h-3 bg-slate-200 rounded-full overflow-hidden">
                                                        <div
                                                            className="h-full bg-gradient-to-r from-blue-500 to-blue-600 transition-all duration-500"
                                                            style={{ width: `${projectProgress.percentage}%` }}
                                                        />
                                                    </div>
                                                </div>

                                                <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-2 sm:gap-3">
                                                    {project.apartments && Object.entries(project.apartments).map(([num, apt]) => {
                                                        const canSee = canSeePaymentStatus(num, viewerApt);
                                                        const isPaid = apt.paid;

                                                        return (
                                                            <div
                                                                key={num}
                                                                onClick={() => isAuthenticated && userRole !== 'resident' && togglePaymentStatus('project', project.pushKey, num)}
                                                                className={`p-3 sm:p-4 rounded-lg border-2 transition-all touch-manipulation ${canSee
                                                                    ? (isPaid
                                                                        ? 'bg-blue-50 border-blue-500 active:bg-blue-100'
                                                                        : projectDaysUntil < 0
                                                                            ? 'bg-red-50 border-red-500 active:bg-red-100'
                                                                            : 'bg-slate-50 border-slate-300 active:bg-slate-100')
                                                                    : 'bg-slate-100 border-slate-400'
                                                                    } ${isAuthenticated && userRole !== 'resident' ? 'cursor-pointer' : ''}`}
                                                            >
                                                                <div className="text-center">
                                                                    <div className="text-base sm:text-lg font-bold text-slate-700 mb-1 sm:mb-2">
                                                                        {t.apartment} {num}
                                                                    </div>

                                                                    {canSee ? (
                                                                        <>
                                                                            <div className="flex justify-center mb-1 sm:mb-2">
                                                                                {isPaid ? (
                                                                                    <Check size={20} className="text-blue-600" />
                                                                                ) : projectDaysUntil < 0 ? (
                                                                                    <X size={20} className="text-red-600" />
                                                                                ) : (
                                                                                    <Clock size={20} className="text-orange-500" />
                                                                                )}
                                                                            </div>
                                                                            <div className={`text-xs font-semibold ${isPaid ? 'text-blue-700' : projectDaysUntil < 0 ? 'text-red-700' : 'text-orange-600'
                                                                                }`}>
                                                                                {isPaid ? t.paid : projectDaysUntil < 0 ? t.overdue : t.unpaid}
                                                                            </div>
                                                                            {isPaid && apt.date && (
                                                                                <div className="text-xs text-slate-500 mt-1">
                                                                                    {new Date(apt.date).toLocaleDateString(language === 'he' ? 'he-IL' : 'en-US', {
                                                                                        month: 'short',
                                                                                        day: 'numeric'
                                                                                    })}
                                                                                </div>
                                                                            )}
                                                                            <div className="text-xs sm:text-sm font-semibold text-slate-600 mt-1">
                                                                                NIS {apt.amount || project.perApartment}
                                                                            </div>
                                                                        </>
                                                                    ) : (
                                                                        <>
                                                                            <div className="flex justify-center mb-1 sm:mb-2">
                                                                                <Lock size={20} className="text-slate-400" />
                                                                            </div>
                                                                            <div className="text-xs font-semibold text-slate-500">
                                                                                🔒 {t.privateStatus}
                                                                            </div>
                                                                        </>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    })
                                }

                                <div className="text-center text-xs sm:text-sm text-slate-500 mt-8 pb-4">
                                    {t.lastUpdated}: {new Date().toLocaleString(language === 'he' ? 'he-IL' : 'en-US')}
                                </div>
                                {/* COPYRIGHT FOOTER */}
                                <div className="text-center text-xs sm:text-sm text-slate-600 mt-8 pb-4 border-t border-slate-200 pt-4">
                                    <p className="font-semibold">© 2025 Valery Lavrov. All Rights Reserved.</p>
                                    <p className="text-slate-500 mt-1">Proprietary Software - Unauthorized use prohibited</p>
                                    <div className="flex justify-center gap-4 mt-3">
                                        <a href="terms.html" className="text-blue-600 hover:text-blue-700 underline">Terms of Service</a>
                                        <a href="privacy.html" className="text-blue-600 hover:text-blue-700 underline">Privacy Policy</a>
                                        <a href="contact.html" className="text-blue-600 hover:text-blue-700 underline">Contact</a>
                                    </div>
                                </div>
                                {/* LIABILITY DISCLAIMER */}
                                <div className="bg-yellow-50 border border-yellow-300 rounded-lg p-3 mt-4 text-xs text-center max-w-4xl mx-auto">
                                    <p className="font-semibold text-yellow-900">
                                        {language === 'he' ? '⚠️ כתב ויתור' : '⚠️ Legal Disclaimer'}
                                    </p>
                                    <p className="text-yellow-800 mt-1">
                                        {language === 'he'
                                            ? 'תוכנה זו מסופקת "כמות שהיא" ללא אחריות. המשתמשים אחראים לאימות כל החישובים הפיננסיים. ראה תנאי שימוש לכתב ויתור מלא.'
                                            : 'This software is provided "as is" without warranties. Users are responsible for verifying all financial calculations. See Terms of Service for full disclaimer.'}
                                    </p>
                                </div>

                            </>
                        )}
                    </div >
                </div >
            );
        };

// Don't render React until Firebase is ready
        window.renderApp = function() {
            ReactDOM.render(<App />, document.getElementById('root'));
        };
    </script>
</body>


</html>
