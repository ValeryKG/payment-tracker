<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Building Payment Tracker</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="app"></div>

    <script>
        // Firebase config for baiti-f1bb5 (Tier 1 - Dashboard)
const firebaseConfig = {
  apiKey: "AIzaSyA0ZH1t5TCaQEtU8FxgnjQP4X2JfJlgX08",
  authDomain: "baiti-f1bb5.firebaseapp.com",
  databaseURL: "https://baiti-f1bb5-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "baiti-f1bb5",
  storageBucket: "baiti-f1bb5.firebasestorage.app",
  messagingSenderId: "395782765837",
  appId: "1:395782765837:web:0775960f26a558d3e5c444"
};

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // Check if user is admin
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            const userRef = db.ref('users/' + user.uid);
            const snapshot = await userRef.once('value');
            const userData = snapshot.val();

            if (!userData || userData.role !== 'admin') {
                alert('Access denied. Admin only.');
                window.location.href = 'index.html';
                return;
            }

            renderAdminPanel(user);
        });

        function renderAdminPanel(user) {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="max-w-7xl mx-auto p-6">
                    <!-- Header -->
                    <div class="bg-white shadow rounded-lg p-6 mb-6">
                        <div class="flex justify-between items-center">
                            <div>
                                <h1 class="text-3xl font-bold text-gray-800">Admin Panel</h1>
                                <p class="text-gray-600">Logged in as: ${user.email}</p>
                            </div>
                            <button onclick="firebase.auth().signOut().then(() => window.location.href='index.html')" 
                                class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded">
                                Logout
                            </button>
                        </div>
                    </div>

                    <!-- Create New Building -->
                    <div class="bg-white shadow rounded-lg p-6 mb-6">
                        <h2 class="text-2xl font-bold text-gray-800 mb-4">Create New Building</h2>
                        <form id="createBuildingForm" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Building Name *</label>
                                <input type="text" id="buildingName" required 
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500"
                                    placeholder="e.g. Demo Building 1">
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Address *</label>
                                <input type="text" id="address" required 
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500"
                                    placeholder="e.g. 123 Demo St, Tel Aviv">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Apartment Count * (CRITICAL)</label>
                                <input type="number" id="apartmentCount" required min="1" max="100" value="16"
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500"
                                    placeholder="e.g. 16">
                                <p class="text-sm text-gray-500 mt-1">Enter number of apartments (1-100)</p>
                            </div>

                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Region</label>
                                    <input type="text" id="region" 
                                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500"
                                        placeholder="e.g. Tel Aviv">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">City</label>
                                    <input type="text" id="city" 
                                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500"
                                        placeholder="e.g. Tel Aviv">
                                </div>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Firebase Project ID * (lowercase, no spaces)</label>
                                <input type="text" id="firebaseProjectId" required 
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500"
                                    placeholder="e.g. demo1-payment">
                                <p class="text-sm text-gray-500 mt-1">Format: buildingname-payment (e.g. demo1-payment, herzl5-payment)</p>
                            </div>

                            <button type="submit" 
                                class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-6 rounded-lg">
                                Create Building
                            </button>
                        </form>
                    </div>

<!-- Buildings List -->
                    <div class="bg-white shadow rounded-lg p-6 mb-6">
                        <h2 class="text-2xl font-bold text-gray-800 mb-4">All Buildings</h2>
                        <div id="buildingsList" class="space-y-2">
                            <p class="text-gray-500">Loading buildings...</p>
                        </div>
                    </div>

                    <!-- Assign Manager to Building -->
                    <div class="bg-white shadow rounded-lg p-6">
                        <h2 class="text-2xl font-bold text-gray-800 mb-4">Assign Manager to Building</h2>
                        <form id="assignManagerForm" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Manager Email *</label>
                                <input type="email" id="managerEmail" required 
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500"
                                    placeholder="manager@test.com">
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Building ID *</label>
                                <input type="text" id="buildingIdAssign" required 
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500"
                                    placeholder="demo1">
                            </div>

                            <button type="submit" 
                                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg">
                                Assign Manager
                            </button>
                        </form>
                    </div>
                </div>
            `;

setupCreateBuildingForm();
            setupAssignManagerForm();
            loadBuildings();
        }

        function setupCreateBuildingForm() {
            document.getElementById('createBuildingForm').addEventListener('submit', async (e) => {
                e.preventDefault();

                const buildingName = document.getElementById('buildingName').value.trim();
                const address = document.getElementById('address').value.trim();
                const apartmentCount = parseInt(document.getElementById('apartmentCount').value);
                const region = document.getElementById('region').value.trim();
                const city = document.getElementById('city').value.trim();
                const firebaseProjectId = document.getElementById('firebaseProjectId').value.trim().toLowerCase();

                // Validate apartment count
                if (apartmentCount < 1 || apartmentCount > 100) {
                    alert('Apartment count must be between 1 and 100');
                    return;
                }

                // Validate Firebase project ID format
                if (!/^[a-z0-9-]+$/.test(firebaseProjectId)) {
                    alert('Firebase Project ID must be lowercase with hyphens only (e.g. demo1-payment)');
                    return;
                }

                const buildingId = firebaseProjectId.replace('-payment', '');

                const buildingConfig = {
                    buildingName: buildingName,
                    address: address,
                    apartmentCount: apartmentCount,
                    region: region || '',
                    city: city || '',
                    firebaseProjectId: firebaseProjectId,
                    createdAt: firebase.database.ServerValue.TIMESTAMP,
                    firebaseConfig: {
                        // Placeholder - admin will need to fill this after creating Firebase project
                        apiKey: "TO_BE_FILLED",
                        authDomain: `${firebaseProjectId}.firebaseapp.com`,
                        databaseURL: `https://${firebaseProjectId}-default-rtdb.europe-west1.firebasedatabase.app`,
                        projectId: firebaseProjectId,
                        storageBucket: `${firebaseProjectId}.firebasestorage.app`,
                        messagingSenderId: "TO_BE_FILLED",
                        appId: "TO_BE_FILLED"
                    }
                };

                try {
                    await db.ref('buildingConfigs/' + buildingId).set(buildingConfig);
                    alert(`Building "${buildingName}" created successfully!\n\nBuilding ID: ${buildingId}\n\nNext steps:\n1. Create Firebase project: ${firebaseProjectId}\n2. Update firebaseConfig with actual API keys`);
                    document.getElementById('createBuildingForm').reset();
                    loadBuildings();
                } catch (error) {
                    alert('Error creating building: ' + error.message);
                }
            });
        }

        async function loadBuildings() {
            const buildingsListDiv = document.getElementById('buildingsList');
            
            try {
                const snapshot = await db.ref('buildingConfigs').once('value');
                const buildings = snapshot.val();

                if (!buildings) {
                    buildingsListDiv.innerHTML = '<p class="text-gray-500">No buildings yet. Create one above.</p>';
                    return;
                }

                let html = '<div class="space-y-3">';
                Object.keys(buildings).forEach(buildingId => {
                    const building = buildings[buildingId];
                    html += `
                        <div class="border border-gray-200 rounded-lg p-4 hover:border-green-500 transition">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-bold text-lg text-gray-800">${building.buildingName}</h3>
                                    <p class="text-sm text-gray-600">${building.address}</p>
                                    <p class="text-sm text-gray-600 mt-1">
                                        <span class="font-semibold">Apartments:</span> ${building.apartmentCount} |
                                        <span class="font-semibold">ID:</span> ${buildingId} |
                                        <span class="font-semibold">Project:</span> ${building.firebaseProjectId}
                                    </p>
                                </div>
                                <button onclick="deleteBuilding('${buildingId}')" 
                                    class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm">
                                    Delete
                                </button>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                buildingsListDiv.innerHTML = html;
            } catch (error) {
                buildingsListDiv.innerHTML = '<p class="text-red-500">Error loading buildings: ' + error.message + '</p>';
            }
        }

async function deleteBuilding(buildingId) {
            if (!confirm(`Are you sure you want to delete building "${buildingId}"?`)) {
                return;
            }

            try {
                await db.ref('buildingConfigs/' + buildingId).remove();
                alert('Building deleted successfully');
                loadBuildings();
            } catch (error) {
                alert('Error deleting building: ' + error.message);
            }
        }

        function setupAssignManagerForm() {
            document.getElementById('assignManagerForm').addEventListener('submit', async (e) => {
                e.preventDefault();

                const managerEmail = document.getElementById('managerEmail').value.trim();
                const buildingId = document.getElementById('buildingIdAssign').value.trim();

                try {
                    // 1. Find manager by email
                    const usersSnapshot = await db.ref('users').orderByChild('email').equalTo(managerEmail).once('value');
                    const users = usersSnapshot.val();

                    if (!users) {
                        alert('Manager not found with email: ' + managerEmail);
                        return;
                    }

                    const managerUid = Object.keys(users)[0];
                    const userData = users[managerUid];

                    if (userData.role !== 'manager') {
                        alert('User is not a manager. Role: ' + userData.role);
                        return;
                    }

                    // 2. Check if building exists
                    const buildingSnapshot = await db.ref('buildingConfigs/' + buildingId).once('value');
                    if (!buildingSnapshot.exists()) {
                        alert('Building not found: ' + buildingId);
                        return;
                    }

                    const buildingConfig = buildingSnapshot.val();

                    // 3. Add building to manager's buildings array
                    const managerBuildingsRef = db.ref('managers/' + managerUid + '/buildings');
                    const currentBuildings = await managerBuildingsRef.once('value');
                    let buildings = currentBuildings.val() || [];

                    if (!Array.isArray(buildings)) {
                        buildings = [];
                    }

                    if (buildings.includes(buildingId)) {
                        alert('Manager already assigned to this building');
                        return;
                    }

                    buildings.push(buildingId);

                    // 4. Update manager data
                    await db.ref('managers/' + managerUid).update({
                        displayName: userData.username || userData.email,
                        email: userData.email,
                        buildings: buildings,
                        buildingCount: buildings.length
                    });

                    // 5. Add manager to building's authorizedManagers in building Firebase
                    const buildingFirebaseConfig = buildingConfig.firebaseConfig;
                    const buildingApp = firebase.initializeApp(buildingFirebaseConfig, 'building-' + buildingId);
                    const buildingDb = buildingApp.database();

                    await buildingDb.ref('authorizedManagers/' + managerUid).set(true);

                    // Cleanup temporary Firebase app
                    await buildingApp.delete();

                    alert(`Manager "${managerEmail}" successfully assigned to building "${buildingId}"!`);
                    document.getElementById('assignManagerForm').reset();

                } catch (error) {
                    alert('Error assigning manager: ' + error.message);
                    console.error(error);
                }
            });
        }
    </script>
</body>
</html>
