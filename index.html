<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Valery Lavrov">
    <meta name="copyright" content="© 2025 Valery Lavrov. All Rights Reserved.">
    <meta name="description" content="Building Payment Tracker - Secure Login">
    <meta name="robots" content="noindex, nofollow">

    <title>Baiti - Building Payment Tracker</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <!-- Baiti Core -->
    <script src="baiti-core.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .rtl {
            direction: rtl;
        }

        .ltr {
            direction: ltr;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen">
    <div id="root"></div>

    <script>
        // ===== LANGUAGE SYSTEM =====
        let currentLang = localStorage.getItem('userLanguage') || (() => {
            const browserLang = navigator.language.toLowerCase();
            if (browserLang.startsWith('he')) return 'he';
            if (browserLang.startsWith('ru')) return 'ru';
            if (browserLang.startsWith('en')) return 'en';
            // Default to English for unrecognized languages
            return 'en';
        })();

        const texts = {
            en: {
                title: 'Building Payment Tracker',
                subtitle: 'Secure Login',
                username: 'Username or Email',
                usernamePlaceholder: 'e.g., apt1 or admin@test.com',
                password: 'Password',
                loginButton: 'Login',
                loggingIn: 'Logging in...',
                invalidCredentials: 'Invalid username or password',
                loginError: 'Login error',
                noRole: 'User role not found. Please contact administrator.',
                footer: '© 2025 Valery Lavrov. All Rights Reserved.',
                links: {
                    terms: 'Terms of Service',
                    privacy: 'Privacy Policy',
                    contact: 'Contact'
                }
            },
            he: {
                title: 'מעקב תשלומים בבניין',
                subtitle: 'כניסה מאובטחת',
                username: 'שם משתמש או אימייל',
                usernamePlaceholder: 'לדוגמה: apt1 או admin@test.com',
                password: 'סיסמה',
                loginButton: 'כניסה',
                loggingIn: 'מתחבר...',
                invalidCredentials: 'שם משתמש או סיסמה שגויים',
                loginError: 'שגיאת התחברות',
                noRole: 'תפקיד משתמש לא נמצא. אנא צור קשר עם מנהל המערכת.',
                footer: '© 2025 ולרי לברוב. כל הזכויות שמורות.',
                links: {
                    terms: 'תנאי שימוש',
                    privacy: 'מדיניות פרטיות',
                    contact: 'יצירת קשר'
                }
            },
            ru: {
                title: 'Учет платежей в здании',
                subtitle: 'Безопасный вход',
                username: 'Имя пользователя или Email',
                usernamePlaceholder: 'например: apt1 или admin@test.com',
                password: 'Пароль',
                loginButton: 'Войти',
                loggingIn: 'Вход...',
                invalidCredentials: 'Неверное имя пользователя или пароль',
                loginError: 'Ошибка входа',
                noRole: 'Роль пользователя не найдена. Свяжитесь с администратором.',
                footer: '© 2025 Валерий Лавров. Все права защищены.',
                links: {
                    terms: 'Условия использования',
                    privacy: 'Политика конфиденциальности',
                    contact: 'Контакты'
                }
            }
        };

        // ===== LOGIN LOGIC =====
        let isLoading = false;

        async function handleLogin(event) {
            event.preventDefault();
            if (isLoading) return;

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const t = texts[currentLang];

            if (!username || !password) {
                alert(t.invalidCredentials);
                return;
            }

            isLoading = true;
            updateLoginButton(true);

            try {
                // Convert username to email if needed
                let emailToUse = username;
                if (!username.includes('@')) {
                    emailToUse = `${username}@building.local`;
                }

                // Sign in with Firebase Auth (from baiti-core.js)
                const userCredential = await metaAuth.signInWithEmailAndPassword(emailToUse, password);
                const user = userCredential.user;

                // Get user data including role
                const userData = await getUserData(user.uid);

                if (!userData || !userData.role) {
                    alert(t.noRole);
                    await metaAuth.signOut();
                    isLoading = false;
                    updateLoginButton(false);
                    return;
                }

                // Redirect based on role using baiti-core.js
                await routeByRole(user);

            } catch (error) {
                console.error('Login error:', error);
                isLoading = false;
                updateLoginButton(false);

                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    alert(t.invalidCredentials);
                } else {
                    alert(t.loginError + ': ' + error.message);
                }
            }
        }

        function updateLoginButton(loading) {
            const button = document.getElementById('loginButton');
            const t = texts[currentLang];
            if (loading) {
                button.disabled = true;
                button.textContent = t.loggingIn;
                button.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                button.disabled = false;
                button.textContent = t.loginButton;
                button.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('userLanguage', lang);
            render();
        }

        function render() {
            const t = texts[currentLang];
            const isRTL = currentLang === 'he';

            document.getElementById('root').innerHTML = `
                <div class="${isRTL ? 'rtl' : 'ltr'} min-h-screen flex items-center justify-center p-4">
                    <div class="w-full max-w-md">
                        <!-- Language Selector -->
                        <div class="flex justify-center gap-2 mb-6">
                            <button 
                                onclick="setLanguage('en')" 
                                class="px-4 py-2 rounded-lg text-sm font-medium transition-colors ${currentLang === 'en' ? 'bg-blue-600 text-white' : 'bg-white hover:bg-slate-50 text-slate-700'}"
                            >
                                English
                            </button>
                            <button 
                                onclick="setLanguage('he')" 
                                class="px-4 py-2 rounded-lg text-sm font-medium transition-colors ${currentLang === 'he' ? 'bg-blue-600 text-white' : 'bg-white hover:bg-slate-50 text-slate-700'}"
                            >
                                עברית
                            </button>
                            <button 
                                onclick="setLanguage('ru')" 
                                class="px-4 py-2 rounded-lg text-sm font-medium transition-colors ${currentLang === 'ru' ? 'bg-blue-600 text-white' : 'bg-white hover:bg-slate-50 text-slate-700'}"
                            >
                                Русский
                            </button>
                        </div>

                        <!-- Login Card -->
                        <div class="bg-white rounded-2xl shadow-xl p-8">
                            <!-- Header -->
                            <div class="text-center mb-8">
                                <h1 class="text-3xl font-bold text-slate-800 mb-2">
                                    ${t.title}
                                </h1>
                                <p class="text-slate-600">
                                    ${t.subtitle}
                                </p>
                            </div>

                            <!-- Login Form -->
                            <form onsubmit="handleLogin(event)" class="space-y-6">
                                <!-- Username -->
                                <div>
                                    <label for="username" class="block text-sm font-medium text-slate-700 mb-2">
                                        ${t.username}
                                    </label>
                                    <input 
                                        type="text" 
                                        id="username" 
                                        required
                                        placeholder="${t.usernamePlaceholder}"
                                        class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                                        dir="${isRTL ? 'rtl' : 'ltr'}"
                                    >
                                </div>

                                <!-- Password -->
                                <div>
                                    <label for="password" class="block text-sm font-medium text-slate-700 mb-2">
                                        ${t.password}
                                    </label>
                                    <input 
                                        type="password" 
                                        id="password" 
                                        required
                                        class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                                    >
                                </div>

                                <!-- Login Button -->
                                <button 
                                    type="submit" 
                                    id="loginButton"
                                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors"
                                >
                                    ${t.loginButton}
                                </button>
                            </form>
                        </div>

                        <!-- Footer Links -->
                        <div class="mt-6 text-center">
                            <div class="flex justify-center gap-4 text-sm">
                                <a href="terms.html" class="text-blue-600 hover:text-blue-700 underline">
                                    ${t.links.terms}
                                </a>
                                <a href="privacy.html" class="text-blue-600 hover:text-blue-700 underline">
                                    ${t.links.privacy}
                                </a>
                                <a href="contact.html" class="text-blue-600 hover:text-blue-700 underline">
                                    ${t.links.contact}
                                </a>
                            </div>
                            <p class="text-xs text-slate-500 mt-4">
                                ${t.footer}
                            </p>
                        </div>
                    </div>
                </div>
            `;

            // Focus username field
            document.getElementById('username').focus();
        }

        // Check if already logged in
        (async function checkAuth() {
            const user = await getCurrentUser();
            if (user) {
                // Already logged in, redirect based on role
                await routeByRole(user);
            } else {
                // Not logged in, show login page
                render();
            }
        })();
    </script>
</body>

</html>
