            const createBackup = async (triggerType, metadata = {}) => {
                try {

                    const usersSnapshot = await database.ref('users').once('value');

                    const buildingData = buildingSnapshot.val();
                    const usersData = usersSnapshot.val();

                    // Create backup object
                    const backup = {
                        timestamp: new Date().toISOString(),
                        triggerType: triggerType, // 'weekly_auto', 'monthly_auto', 'before_user_creation', 'before_project_deletion'
                        metadata: metadata,
                        dataSnapshot: {
                            buildingData: buildingData,
                            users: usersData
                        }
                    };

                    // Generate unique backup key
                    const backupKey = `backup-${Date.now()}`;

                    // Save to supportBackups node
                    await database.ref(`supportBackups/${backupKey}`).set(backup);

                    // Cleanup old backups (keep last 50)
                    await cleanupOldBackups();

                    console.log(`✅ Backup created: ${triggerType}`);
                    return true;
                } catch (error) {
                    console.error('Backup creation error:', error);
                    return false;
                }
            };

            const cleanupOldBackups = async () => {
                try {
                    const backupsRef = database.ref('supportBackups');
                    const snapshot = await backupsRef.once('value');
                    const backups = snapshot.val();

                    if (!backups) return;

                    // Convert to array and sort by timestamp (oldest first)
                    const backupArray = Object.entries(backups).map(([key, data]) => ({
                        key,
                        timestamp: data.timestamp
                    }));

                    backupArray.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

                    // If more than 50, delete oldest ones
                    if (backupArray.length > 50) {
                        const toDelete = backupArray.slice(0, backupArray.length - 50);
                        for (let backup of toDelete) {
                            await database.ref(`supportBackups/${backup.key}`).remove();
                        }
                        console.log(`🗑️ Cleaned up ${toDelete.length} old backups`);
                    }
                } catch (error) {
                    console.error('Cleanup error:', error);
                }
            };

                    const lastWeeklyBackup = localStorage.getItem('lastWeeklyBackup');
                    const lastMonthlyBackup = localStorage.getItem('lastMonthlyBackup');

                    const today = now.toISOString().split('T')[0]; // YYYY-MM-DD

                    // Weekly backup (every Sunday)
                    if (dayOfWeek === 0 && lastWeeklyBackup !== today) {
                        await createBackup('weekly_auto', { day: 'Sunday' });

                                                {/* Title Hebrew */}
                                                <div>
                                                    <label className="block text-sm font-medium text-slate-700 mb-1">Title (Hebrew)</label>
                                                    <input
                                                        type="text"
                                                        value={newAnnouncement.titleHe}
                                                        onChange={(e) => setNewAnnouncement({ ...newAnnouncement, titleHe: e.target.value })}
                                                        className="w-full px-4 py-3 border border-slate-300 rounded-lg text-base"
                                                        placeholder="אסיפת בית"
                                                        dir="rtl"
                                                    />
                                                </div>

                                                {/* Message English */}
                                                <div>
                                                    <label className="block text-sm font-medium text-slate-700 mb-1">Message (English)</label>
                                                    <textarea
                                                        value={newAnnouncement.messageEn}
                                                        onChange={(e) => setNewAnnouncement({ ...newAnnouncement, messageEn: e.target.value })}
                                                        className="w-full px-4 py-3 border border-slate-300 rounded-lg text-base"
                                                        rows="4"
                                                        placeholder="Important meeting this Sunday at 7 PM in the lobby..."
                                                    />
                                                </div>

                                                {/* Message Hebrew */}
                                                <div>
                                                    <label className="block text-sm font-medium text-slate-700 mb-1">Message (Hebrew)</label>
                                                    <textarea
                                                        value={newAnnouncement.messageHe}
                                                        onChange={(e) => setNewAnnouncement({ ...newAnnouncement, messageHe: e.target.value })}
                                                        className="w-full px-4 py-3 border border-slate-300 rounded-lg text-base"
                                                        rows="4"
                                                        placeholder="אסיפה חשובה ביום ראשון בשעה 19:00 בלובי..."
                                                        dir="rtl"
                                                    />
                                                </div>

                                                {/* Priority */}
                                                <div>
                                                    <label className="block text-sm font-medium text-slate-700 mb-1">Priority Level</label>
                                                    <select
                                                        value={newAnnouncement.priority}
                                                        onChange={(e) => setNewAnnouncement({ ...newAnnouncement, priority: e.target.value })}
                                                        className="w-full px-4 py-3 border border-slate-300 rounded-lg text-base"
                                                    >
                                                        <option value="normal">🟢 Normal</option>
                                                        <option value="urgent">🟠 Urgent</option>
                                                        <option value="critical">🔴 Critical</option>
                                                    </select>
                                                    <p className="text-xs text-slate-500 mt-1">
                                                        Critical and urgent announcements are highlighted with colored borders
                                                    </p>
                                                </div>

                                                {/* Expiration Date */}
                                                <div>
                                                    <label className="block text-sm font-medium text-slate-700 mb-1">Expires On (Optional)</label>
                                                    <input
                                                        type="date"
                                                        value={newAnnouncement.expiresAt}
                                                        onChange={(e) => setNewAnnouncement({ ...newAnnouncement, expiresAt: e.target.value })}
                                                        className="w-full px-4 py-3 border border-slate-300 rounded-lg text-base"
                                                    />
                                                    <p className="text-xs text-slate-500 mt-1">
                                                        Leave empty for permanent announcement. Expired posts are auto-deleted.
                                                    </p>
                                                </div>
                                            </div>

                                            {/* Action Buttons */}
                                            <div className="flex gap-2 mt-6">
                                                <button
                                                    onClick={handlePostAnnouncement}
                                                    className="flex-1 px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium flex items-center justify-center gap-2 transition-colors touch-manipulation"
                                                >
                                                    <Save size={18} />
                                                    Post Announcement
                                                </button>
                                                <button
                                                    onClick={() => setShowAnnouncementForm(false)}
                                                    className="flex-1 px-4 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg font-medium transition-colors"
                                                >
                                                    Cancel
                                                </button>



                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* Monthly Bills Section */}
                                <div className="bg-white rounded-lg shadow-lg p-3 sm:p-6 mb-4 sm:mb-6">
                                    <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-4 gap-2">
                                        <h2 className="text-xl sm:text-2xl font-bold text-slate-800">{t.monthlyBills}</h2>
                                        {daysUntilDue < 0 ? (
                                            <div className="flex items-center gap-2 text-red-600 font-semibold text-sm sm:text-base">
                                                <AlertCircle size={18} />
                                                {Math.abs(daysUntilDue)} {t.daysOverdue}
                                            </div>
                                        ) : daysUntilDue <= 3 ? (
                                            <div className="flex items-center gap-2 text-orange-600 font-semibold text-sm sm:text-base">
                                                <Clock size={18} />
                                                {daysUntilDue} {t.daysUntilDue}
                                            </div>
                                        ) : null}
                                    </div>

                                    <div className="mb-4 sm:mb-6">
                                        <div className="flex justify-between items-center mb-2 text-xs sm:text-sm">
                                            <span className="font-medium text-slate-600">
                                                {t.progress}: {monthlyProgress.paid}/{monthlyProgress.total} ({monthlyProgress.percentage}%)
                                            </span>
                                            <span className="font-medium text-slate-600">
                                                NIS {isNaN(monthlyProgress.paid * (currentMonthData.amount || monthlySettings.amount)) ? 0 : monthlyProgress.paid * (currentMonthData.amount || monthlySettings.amount)} /
                                                NIS {isNaN(monthlyProgress.total * (currentMonthData.amount || monthlySettings.amount)) ? 0 : monthlyProgress.total * (currentMonthData.amount || monthlySettings.amount)}
                                            </span>

                                        </div>
                                        <div className="h-3 bg-slate-200 rounded-full overflow-hidden">
                                            <div
                                                className="h-full bg-gradient-to-r from-green-500 to-green-600 transition-all duration-500"
                                                style={{ width: `${monthlyProgress.percentage}%` }}
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-2 sm:gap-3">
                                        {currentMonthData.apartments && Object.entries(currentMonthData.apartments).map(([num, apt]) => {
                                            const canSee = canSeePaymentStatus(num);
                                            const isPaid = apt.paid;

                                            return (
                                                <div
                                                    key={num}
                                                    onClick={() => isAuthenticated && userRole !== 'resident' && togglePaymentStatus('monthly', null, num)}
                                                    className={`p-3 sm:p-4 rounded-lg border-2 transition-all touch-manipulation ${canSee
                                                        ? (isPaid
                                                            ? 'bg-green-50 border-green-500 active:bg-green-100'
                                                            : daysUntilDue < 0
                                                                ? 'bg-red-50 border-red-500 active:bg-red-100'
                                                                : 'bg-slate-50 border-slate-300 active:bg-slate-100')
                                                        : 'bg-slate-100 border-slate-400'
                                                        } ${isAuthenticated && userRole !== 'resident' ? 'cursor-pointer' : ''}`}
                                                >
                                                    <div className="text-center">
                                                        <div className="text-base sm:text-lg font-bold text-slate-700 mb-1 sm:mb-2">
                                                            {t.apartment} {num}
                                                        </div>

                                                        {canSee ? (
                                                            <>
                                                                <div className="flex justify-center mb-1 sm:mb-2">
                                                                    {isPaid ? (
                                                                        <Check size={20} className="text-green-600" />
                                                                    ) : daysUntilDue < 0 ? (
                                                                        <X size={20} className="text-red-600" />
                                                                    ) : (
                                                                        <Clock size={20} className="text-orange-500" />
                                                                    )}
                                                                </div>
                                                                <div className={`text-xs font-semibold ${isPaid ? 'text-green-700' : daysUntilDue < 0 ? 'text-red-700' : 'text-orange-600'
                                                                    }`}>
                                                                    {isPaid ? t.paid : daysUntilDue < 0 ? t.overdue : t.unpaid}
                                                                </div>
                                                                {isPaid && apt.date && (
                                                                    <div className="text-xs text-slate-500 mt-1">
                                                                        {new Date(apt.date).toLocaleDateString(language === 'he' ? 'he-IL' : 'en-US', {
                                                                            month: 'short',
                                                                            day: 'numeric'
                                                                        })}
                                                                    </div>
                                                                )}
                                                                <div className="text-xs sm:text-sm font-semibold text-slate-600 mt-1">
                                                                    NIS {apt.amount || currentMonthData.amount}
                                                                </div>
                                                            </>
                                                        ) : (
                                                            <>
                                                                <div className="flex justify-center mb-1 sm:mb-2">
                                                                    <Lock size={20} className="text-slate-400" />
                                                                </div>
                                                                <div className="text-xs font-semibold text-slate-500">
                                                                    🔒 {t.privateStatus}
                                                                </div>
                                                            </>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* Special Projects */}
                                {/* Special Projects */}
                                {data.projectsWithKeys && data.projectsWithKeys.length > 0 && data.projectsWithKeys.map(project => {
                                    const projectProgress = calculateProgress(project.apartments);
                                    const projectDaysUntil = getProjectDaysUntilDue(project.dueDate);
                                    const projectPushKey = project.pushKey;  // NEW: From attached key

                                    return (
                                        <div key={projectPushKey} className="bg-white rounded-lg shadow-lg p-3 sm:p-6 mb-4 sm:mb-6">
                                            <div className="mb-4">
                                                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-2 gap-2">
                                                    <div className="flex-1">
                                                        <div className="flex items-center gap-2">
                                                            <h2 className="text-xl sm:text-2xl font-bold text-slate-800">
                                                                {language === 'he' ? project.nameHe : project.name}
                                                            </h2>
                                                            {isAuthenticated && (
                                                                <button
                                                                    onClick={() => handleDeleteProject(projectPushKey)}  // CHANGED: Pass pushKey
                                                                    className="p-1 hover:bg-red-100 rounded text-red-600 touch-manipulation"
                                                                >
                                                                    <Trash2 size={18} />
                                                                </button>
                                                            )}
                                                        </div>
                                                    </div>
                                                    {projectDaysUntil < 0 ? (
                                                        <div className="flex items-center gap-2 text-red-600 font-semibold text-sm sm:text-base">
                                                            <AlertCircle size={18} />
                                                            {Math.abs(projectDaysUntil)} {t.daysOverdue}
                                                        </div>
                                                    ) : projectDaysUntil <= 7 ? (
                                                        <div className="flex items-center gap-2 text-orange-600 font-semibold text-sm sm:text-base">
                                                            <Clock size={18} />
                                                            {projectDaysUntil} {t.daysUntilDue}
                                                        </div>
                                                    ) : null}
                                                </div>
                                                <p className="text-sm sm:text-base text-slate-600 mb-2">
                                                    {language === 'he' ? project.descriptionHe : project.description}
                                                </p>
                                                <div className="flex flex-wrap gap-2 sm:gap-4 text-xs sm:text-sm">
                                                    <span className="text-slate-600">
                                                        <strong>{t.total}:</strong> NIS {project.total.toLocaleString()}
                                                    </span>
                                                    <span className="text-slate-600">
                                                        <strong>NIS {project.perApartment}</strong> {t.perApartment}
                                                    </span>
                                                    <span className="text-slate-600">
                                                        <strong>{t.dueDate}:</strong> {new Date(project.dueDate).toLocaleDateString(language === 'he' ? 'he-IL' : 'en-US')}
                                                    </span>
                                                </div>
                                            </div>

                                            <div className="mb-4 sm:mb-6">
                                                <div className="flex justify-between items-center mb-2 text-xs sm:text-sm">
                                                    <span className="font-medium text-slate-600">
                                                        {t.progress}: {projectProgress.paid}/{projectProgress.total} ({projectProgress.percentage}%)
                                                    </span>
                                                    <span className="font-medium text-slate-600">
                                                        NIS {(projectProgress.paid * project.perApartment).toLocaleString()} / NIS {project.total.toLocaleString()}
                                                    </span>
                                                </div>
                                                <div className="h-3 bg-slate-200 rounded-full overflow-hidden">
                                                    <div
                                                        className="h-full bg-gradient-to-r from-blue-500 to-blue-600 transition-all duration-500"
                                                        style={{ width: `${projectProgress.percentage}%` }}
                                                    />
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-2 sm:gap-3">
                                                {project.apartments && Object.entries(project.apartments).map(([num, apt]) => {
                                                    const canSee = canSeePaymentStatus(num);
                                                    const isPaid = apt.paid;

                                                    return (
                                                        <div
                                                            key={num}
                                                            onClick={() => isAuthenticated && userRole !== 'resident' && togglePaymentStatus('project', project.pushKey, num)}
                                                            className={`p-3 sm:p-4 rounded-lg border-2 transition-all touch-manipulation ${canSee
                                                                ? (isPaid
                                                                    ? 'bg-blue-50 border-blue-500 active:bg-blue-100'
                                                                    : projectDaysUntil < 0
                                                                        ? 'bg-red-50 border-red-500 active:bg-red-100'
                                                                        : 'bg-slate-50 border-slate-300 active:bg-slate-100')
                                                                : 'bg-slate-100 border-slate-400'
                                                                } ${isAuthenticated && userRole !== 'resident' ? 'cursor-pointer' : ''}`}
                                                        >
                                                            <div className="text-center">
                                                                <div className="text-base sm:text-lg font-bold text-slate-700 mb-1 sm:mb-2">
                                                                    {t.apartment} {num}
                                                                </div>

                                                                {canSee ? (
                                                                    <>
                                                                        <div className="flex justify-center mb-1 sm:mb-2">
                                                                            {isPaid ? (
                                                                                <Check size={20} className="text-blue-600" />
                                                                            ) : projectDaysUntil < 0 ? (
                                                                                <X size={20} className="text-red-600" />
                                                                            ) : (
                                                                                <Clock size={20} className="text-orange-500" />
                                                                            )}
                                                                        </div>
                                                                        <div className={`text-xs font-semibold ${isPaid ? 'text-blue-700' : projectDaysUntil < 0 ? 'text-red-700' : 'text-orange-600'
                                                                            }`}>
                                                                            {isPaid ? t.paid : projectDaysUntil < 0 ? t.overdue : t.unpaid}
                                                                        </div>
                                                                        {isPaid && apt.date && (
                                                                            <div className="text-xs text-slate-500 mt-1">
                                                                                {new Date(apt.date).toLocaleDateString(language === 'he' ? 'he-IL' : 'en-US', {
                                                                                    month: 'short',
                                                                                    day: 'numeric'
                                                                                })}
                                                                            </div>
                                                                        )}
                                                                        <div className="text-xs sm:text-sm font-semibold text-slate-600 mt-1">
                                                                            NIS {apt.amount || project.perApartment}
                                                                        </div>
                                                                    </>
                                                                ) : (
                                                                    <>
                                                                        <div className="flex justify-center mb-1 sm:mb-2">
                                                                            <Lock size={20} className="text-slate-400" />
                                                                        </div>
                                                                        <div className="text-xs font-semibold text-slate-500">
                                                                            🔒 {t.privateStatus}
                                                                        </div>
                                                                    </>
                                                                )}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    );
                                })}

                                <div className="text-center text-xs sm:text-sm text-slate-500 mt-8 pb-4">
                                    {t.lastUpdated}: {new Date().toLocaleString(language === 'he' ? 'he-IL' : 'en-US')}
                                </div>

                            </>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.render(<PaymentTracker />, document.getElementById('root'));
    </script>
</body>

</html>
