<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Payment Tracker</title>
    
    <!-- Tailwind CSS from CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons from CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* Custom RTL support */
        .rtl {
            direction: rtl;
        }
        
        /* Touch-friendly interactions */
        .touch-manipulation {
            touch-action: manipulation;
        }
        
        /* Smooth transitions */
        * {
            transition-property: background-color, border-color, color, fill, stroke;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 150ms;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const PaymentTracker = () => {
          const [currentDate, setCurrentDate] = useState(new Date());
          const [isAuthenticated, setIsAuthenticated] = useState(false);
          const [userRole, setUserRole] = useState(null);
          const [showLogin, setShowLogin] = useState(false);
          const [password, setPassword] = useState('');
          const [language, setLanguage] = useState('en');
          const [showAdminPanel, setShowAdminPanel] = useState(false);
          const [showProjectForm, setShowProjectForm] = useState(false);
          const [showMonthlySettings, setShowMonthlySettings] = useState(false);
          const [showManagerSettings, setShowManagerSettings] = useState(false);
          
          const [newProject, setNewProject] = useState({
            name: '',
            nameHe: '',
            total: '',
            dueDate: '',
            description: '',
            descriptionHe: ''
          });
          
          const [monthlySettings, setMonthlySettings] = useState({
            amount: 150,
            dueDay: 5
          });
          
          const [managerSettings, setManagerSettings] = useState({
            newManagerEmail: '',
            newManagerPassword: ''
          });
          
          const [data, setData] = useState({
            monthlyBills: {
              '2025-10': {
                amount: 150,
                dueDay: 5,
                apartments: {
                  1: { paid: true, date: '2025-10-02', amount: 150 },
                  2: { paid: true, date: '2025-10-03', amount: 150 },
                  3: { paid: false },
                  4: { paid: true, date: '2025-10-04', amount: 150 },
                  5: { paid: false },
                  6: { paid: true, date: '2025-10-01', amount: 150 },
                  7: { paid: true, date: '2025-10-05', amount: 150 },
                  8: { paid: false },
                  9: { paid: true, date: '2025-10-02', amount: 150 },
                  10: { paid: true, date: '2025-10-06', amount: 150 },
                  11: { paid: false },
                  12: { paid: true, date: '2025-10-03', amount: 150 },
                  13: { paid: true, date: '2025-10-04', amount: 150 },
                  14: { paid: false },
                  15: { paid: true, date: '2025-10-01', amount: 150 },
                  16: { paid: true, date: '2025-10-05', amount: 150 }
                }
              }
            },
            projects: [
              {
                id: 'solar-2025',
                name: 'Solar System Repair',
                nameHe: 'תיקון מערכת סולארית',
                total: 5000,
                perApartment: 312.50,
                dueDate: '2025-12-01',
                description: 'Emergency repair of rooftop solar panels',
                descriptionHe: 'תיקון חירום של פאנלים סולאריים בגג',
                apartments: {
                  1: { paid: true, date: '2025-10-15', amount: 312.50 },
                  2: { paid: false },
                  3: { paid: true, date: '2025-10-16', amount: 312.50 },
                  4: { paid: false },
                  5: { paid: false },
                  6: { paid: true, date: '2025-10-14', amount: 312.50 },
                  7: { paid: false },
                  8: { paid: false },
                  9: { paid: true, date: '2025-10-17', amount: 312.50 },
                  10: { paid: false },
                  11: { paid: false },
                  12: { paid: true, date: '2025-10-15', amount: 312.50 },
                  13: { paid: false },
                  14: { paid: false },
                  15: { paid: true, date: '2025-10-14', amount: 312.50 },
                  16: { paid: false }
                }
              }
            ],
            settings: {
              currentManager: 'manager@building.com',
              managerPassword: 'manager123',
              admin: 'admin@building.com',
              adminPassword: 'admin123'
            }
          });

          const texts = {
            en: {
              title: 'Building Payment Tracker',
              login: 'Manager Login',
              logout: 'Logout',
              adminPanel: 'Admin Panel',
              managerPanel: 'Manager Panel',
              monthlyBills: 'Monthly Bills',
              specialProjects: 'Special Projects',
              apartment: 'Apt',
              paid: 'PAID',
              unpaid: 'DUE',
              overdue: 'OVERDUE',
              progress: 'Progress',
              total: 'Total',
              perApartment: 'per apartment',
              dueDate: 'Due Date',
              lastUpdated: 'Last updated',
              password: 'Password',
              submit: 'Submit',
              cancel: 'Cancel',
              save: 'Save',
              delete: 'Delete',
              edit: 'Edit',
              create: 'Create',
              close: 'Close',
              daysOverdue: 'days overdue',
              daysUntilDue: 'days until due',
              createProject: 'Create Special Project',
              editMonthly: 'Edit Monthly Bills',
              manageManagers: 'Manage Managers',
              projectName: 'Project Name',
              projectNameHe: 'Project Name (Hebrew)',
              totalAmount: 'Total Amount',
              description: 'Description',
              descriptionHe: 'Description (Hebrew)',
              monthlyAmount: 'Monthly Amount per Apartment',
              dueDayOfMonth: 'Due Day of Month',
              currentManager: 'Current Manager',
              newManager: 'New Manager Email',
              newPassword: 'New Manager Password',
              assignManager: 'Assign New Manager',
              fillAllFields: 'Please fill all fields',
              projectCreated: 'Project created successfully!',
              settingsSaved: 'Settings saved successfully!',
              managerAssigned: 'New manager assigned successfully!',
              confirmDelete: 'Are you sure you want to delete this project?',
            },
            he: {
              title: 'מעקב תשלומים בבניין',
              login: 'כניסת מנהל',
              logout: 'יציאה',
              adminPanel: 'פאנל ניהול',
              managerPanel: 'פאנל מנהל',
              monthlyBills: 'חשבונות חודשיים',
              specialProjects: 'פרויקטים מיוחדים',
              apartment: 'דירה',
              paid: 'שולם',
              unpaid: 'טרם שולם',
              overdue: 'באיחור',
              progress: 'התקדמות',
              total: 'סה״כ',
              perApartment: 'לדירה',
              dueDate: 'תאריך יעד',
              lastUpdated: 'עודכן לאחרונה',
              password: 'סיסמה',
              submit: 'אישור',
              cancel: 'ביטול',
              save: 'שמור',
              delete: 'מחק',
              edit: 'ערוך',
              create: 'צור',
              close: 'סגור',
              daysOverdue: 'ימים באיחור',
              daysUntilDue: 'ימים עד למועד',
              createProject: 'צור פרויקט מיוחד',
              editMonthly: 'ערוך חשבונות חודשיים',
              manageManagers: 'נהל מנהלים',
              projectName: 'שם הפרויקט',
              projectNameHe: 'שם הפרויקט (עברית)',
              totalAmount: 'סכום כולל',
              description: 'תיאור',
              descriptionHe: 'תיאור (עברית)',
              monthlyAmount: 'סכום חודשי לדירה',
              dueDayOfMonth: 'יום תשלום בחודש',
              currentManager: 'מנהל נוכחי',
              newManager: 'אימייל מנהל חדש',
              newPassword: 'סיסמה למנהל חדש',
              assignManager: 'הקצה מנהל חדש',
              fillAllFields: 'אנא מלא את כל השדות',
              projectCreated: 'הפרויקט נוצר בהצלחה!',
              settingsSaved: 'ההגדרות נשמרו בהצלחה!',
              managerAssigned: 'מנהל חדש הוקצה בהצלחה!',
              confirmDelete: 'האם אתה בטוח שברצונך למחוק את הפרויקט?',
            }
          };

          const t = texts[language];

          const getCurrentMonthKey = () => {
            const year = currentDate.getFullYear();
            const month = String(currentDate.getMonth() + 1).padStart(2, '0');
            return `${year}-${month}`;
          };

          const formatMonthYear = (dateStr) => {
            const [year, month] = dateStr.split('-');
            const date = new Date(year, parseInt(month) - 1);
            return date.toLocaleDateString(language === 'he' ? 'he-IL' : 'en-US', { 
              month: 'long', 
              year: 'numeric' 
            });
          };

          const changeMonth = (direction) => {
            const newDate = new Date(currentDate);
            newDate.setMonth(newDate.getMonth() + direction);
            setCurrentDate(newDate);
          };

          const getDaysUntilDue = (dueDay) => {
            const today = new Date();
            const dueDate = new Date(today.getFullYear(), today.getMonth(), dueDay);
            const diffTime = dueDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return diffDays;
          };

          const getProjectDaysUntilDue = (dueDateStr) => {
            const today = new Date();
            const dueDate = new Date(dueDateStr);
            const diffTime = dueDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return diffDays;
          };

          const calculateProgress = (apartments) => {
            const total = Object.keys(apartments).length;
            const paid = Object.values(apartments).filter(a => a.paid).length;
            return { paid, total, percentage: Math.round((paid / total) * 100) };
          };

          const handleLogin = () => {
            if (password === data.settings.adminPassword) {
              setUserRole('admin');
              setIsAuthenticated(true);
              setShowLogin(false);
              setPassword('');
            } else if (password === data.settings.managerPassword) {
              setUserRole('manager');
              setIsAuthenticated(true);
              setShowLogin(false);
              setPassword('');
            } else {
              alert('Invalid password');
            }
          };

          const togglePaymentStatus = (type, id, apartmentNum) => {
            if (!isAuthenticated) return;
            
            setData(prev => {
              const newData = { ...prev };
              if (type === 'monthly') {
                const currentMonth = getCurrentMonthKey();
                if (!newData.monthlyBills[currentMonth]) {
                  newData.monthlyBills[currentMonth] = {
                    amount: monthlySettings.amount,
                    dueDay: monthlySettings.dueDay,
                    apartments: Object.fromEntries([...Array(16)].map((_, i) => [i + 1, { paid: false }]))
                  };
                }
                const currentStatus = newData.monthlyBills[currentMonth].apartments[apartmentNum].paid;
                newData.monthlyBills[currentMonth].apartments[apartmentNum] = {
                  paid: !currentStatus,
                  date: !currentStatus ? new Date().toISOString().split('T')[0] : undefined,
                  amount: newData.monthlyBills[currentMonth].amount
                };
              } else if (type === 'project') {
                const project = newData.projects.find(p => p.id === id);
                const currentStatus = project.apartments[apartmentNum].paid;
                project.apartments[apartmentNum] = {
                  paid: !currentStatus,
                  date: !currentStatus ? new Date().toISOString().split('T')[0] : undefined,
                  amount: project.perApartment
                };
              }
              return newData;
            });
          };

          const handleCreateProject = () => {
            if (!newProject.name || !newProject.total || !newProject.dueDate) {
              alert(t.fillAllFields);
              return;
            }

            const total = parseFloat(newProject.total);
            const perApartment = Math.round((total / 16) * 100) / 100;
            
            const project = {
              id: `project-${Date.now()}`,
              name: newProject.name,
              nameHe: newProject.nameHe || newProject.name,
              total: total,
              perApartment: perApartment,
              dueDate: newProject.dueDate,
              description: newProject.description || '',
              descriptionHe: newProject.descriptionHe || newProject.description || '',
              apartments: Object.fromEntries([...Array(16)].map((_, i) => [i + 1, { paid: false }]))
            };

            setData(prev => ({
              ...prev,
              projects: [...prev.projects, project]
            }));

            setNewProject({
              name: '',
              nameHe: '',
              total: '',
              dueDate: '',
              description: '',
              descriptionHe: ''
            });
            
            setShowProjectForm(false);
            alert(t.projectCreated);
          };

          const handleDeleteProject = (projectId) => {
            if (window.confirm(t.confirmDelete)) {
              setData(prev => ({
                ...prev,
                projects: prev.projects.filter(p => p.id !== projectId)
              }));
            }
          };

          const handleSaveMonthlySettings = () => {
            const currentMonth = getCurrentMonthKey();
            setData(prev => {
              const newData = { ...prev };
              if (!newData.monthlyBills[currentMonth]) {
                newData.monthlyBills[currentMonth] = {
                  amount: monthlySettings.amount,
                  dueDay: monthlySettings.dueDay,
                  apartments: Object.fromEntries([...Array(16)].map((_, i) => [i + 1, { paid: false }]))
                };
              } else {
                newData.monthlyBills[currentMonth].amount = monthlySettings.amount;
                newData.monthlyBills[currentMonth].dueDay = monthlySettings.dueDay;
              }
              return newData;
            });
            
            setShowMonthlySettings(false);
            alert(t.settingsSaved);
          };

          const handleAssignManager = () => {
            if (!managerSettings.newManagerEmail || !managerSettings.newManagerPassword) {
              alert(t.fillAllFields);
              return;
            }

            setData(prev => ({
              ...prev,
              settings: {
                ...prev.settings,
                currentManager: managerSettings.newManagerEmail,
                managerPassword: managerSettings.newManagerPassword
              }
            }));

            setManagerSettings({
              newManagerEmail: '',
              newManagerPassword: ''
            });
            
            setShowManagerSettings(false);
            alert(t.managerAssigned);
          };

          const currentMonthKey = getCurrentMonthKey();
          const currentMonthData = data.monthlyBills[currentMonthKey] || {
            amount: monthlySettings.amount,
            dueDay: monthlySettings.dueDay,
            apartments: Object.fromEntries([...Array(16)].map((_, i) => [i + 1, { paid: false }]))
          };

          const monthlyProgress = calculateProgress(currentMonthData.apartments);
          const daysUntilDue = getDaysUntilDue(currentMonthData.dueDay);

          useEffect(() => {
            setMonthlySettings({
              amount: currentMonthData.amount,
              dueDay: currentMonthData.dueDay
            });
          }, [currentMonthKey]);

          useEffect(() => {
            lucide.createIcons();
          });

          return (
            <div className={`min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 p-2 sm:p-4 ${language === 'he' ? 'rtl' : 'ltr'}`}>
              <div className="max-w-6xl mx-auto">
                {/* Header */}
                <div className="bg-white rounded-lg shadow-lg p-3 sm:p-6 mb-4 sm:mb-6">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
                    <h1 className="text-xl sm:text-3xl font-bold text-slate-800">{t.title}</h1>
                    <div className="flex gap-2 flex-wrap">
                      <button
                        onClick={() => setLanguage(language === 'en' ? 'he' : 'en')}
                        className="px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs sm:text-sm font-medium transition-colors"
                      >
                        {language === 'en' ? 'עברית' : 'English'}
                      </button>
                      {isAuthenticated ? (
                        <>
                          <button
                            onClick={() => setShowAdminPanel(!showAdminPanel)}
                            className="px-3 py-2 bg-purple-100 hover:bg-purple-200 text-purple-700 rounded-lg text-xs sm:text-sm font-medium flex items-center gap-2 transition-colors"
                          >
                            <i data-lucide="settings" className="w-4 h-4"></i>
                            {userRole === 'admin' ? t.adminPanel : t.managerPanel}
                          </button>
                          <button
                            onClick={() => { setIsAuthenticated(false); setUserRole(null); setShowAdminPanel(false); }}
                            className="px-3 py-2 bg-red-100 hover:bg-red-200 text-red-700 rounded-lg text-xs sm:text-sm font-medium transition-colors"
                          >
                            {t.logout}
                          </button>
                        </>
                      ) : (
                        <button
                          onClick={() => setShowLogin(true)}
                          className="px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs sm:text-sm font-medium flex items-center gap-2 transition-colors"
                        >
                          <i data-lucide="lock" className="w-4 h-4"></i>
                          {t.login}
                        </button>
                      )}
                    </div>
                  </div>
                  
                  {/* Admin Panel */}
                  {showAdminPanel && isAuthenticated && (
                    <div className="mt-4 p-4 bg-purple-50 rounded-lg border-2 border-purple-200">
                      <h3 className="text-lg font-bold text-purple-900 mb-3">
                        {userRole === 'admin' ? t.adminPanel : t.managerPanel}
                      </h3>
                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
                        <button
                          onClick={() => setShowProjectForm(true)}
                          className="px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium flex items-center justify-center gap-2 transition-colors"
                        >
                          <i data-lucide="plus" className="w-5 h-5"></i>
                          {t.createProject}
                        </button>
                        <button
                          onClick={() => setShowMonthlySettings(true)}
                          className="px-4 py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium flex items-center justify-center gap-2 transition-colors"
                        >
                          <i data-lucide="edit-2" className="w-5 h-5"></i>
                          {t.editMonthly}
                        </button>
                        {userRole === 'admin' && (
                          <button
                            onClick={() => setShowManagerSettings(true)}
                            className="px-4 py-3 bg-orange-600 hover:bg-orange-700 text-white rounded-lg font-medium flex items-center justify-center gap-2 transition-colors"
                          >
                            <i data-lucide="user" className="w-5 h-5"></i>
                            {t.manageManagers}
                          </button>
                        )}
                      </div>
                    </div>
                  )}
                  
                  {/* Month Navigation */}
                  <div className="flex items-center justify-center gap-4 mt-4">
                    <button
                      onClick={() => changeMonth(-1)}
                      className="p-2 hover:bg-slate-100 rounded-lg transition-colors touch-manipulation"
                    >
                      <i data-lucide="chevron-left" className="w-6 h-6"></i>
                    </button>
                    <h2 className="text-base sm:text-xl font-semibold text-slate-700 min-w-[180px] sm:min-w-[200px] text-center">
                      {formatMonthYear(currentMonthKey)}
                    </h2>
                    <button
                      onClick={() => changeMonth(1)}
                      className="p-2 hover:bg-slate-100 rounded-lg transition-colors touch-manipulation"
                    >
                      <i data-lucide="chevron-right" className="w-6 h-6"></i>
                    </button>
                  </div>
                </div>

                {/* Login Modal */}
                {showLogin && (
                  <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-lg p-4 sm:p-6 w-full max-w-md">
                      <h3 className="text-lg sm:text-xl font-bold mb-4">{t.login}</h3>
                      <input
                        type="password"
                        value={password}
                        onChange={(e) => setPassword(e.target.value)}
                        onKeyPress={(e) => e.key === 'Enter' && handleLogin()}
                        placeholder={t.password}
                        className="w-full px-4 py-3 border border-slate-300 rounded-lg mb-4 text-base"
                      />
                      <div className="flex gap-2">
                        <button
                          onClick={handleLogin}
                          className="flex-1 px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors touch-manipulation"
                        >
                          {t.submit}
                        </button>
                        <button
                          onClick={() => { setShowLogin(false); setPassword(''); }}
                          className="flex-1 px-4 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg font-medium transition-colors touch-manipulation"
                        >
                          {t.cancel}
                        </button>
                      </div>
                      <p className="text-xs text-slate-500 mt-4">Demo: admin123 or manager123</p>
                    </div>
                  </div>
                )}

                {/* Create Project Modal */}
                {showProjectForm && (
                  <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4 overflow-y-auto">
                    <div className="bg-white rounded-lg p-4 sm:p-6 w-full max-w-2xl my-8">
                      <div className="flex justify-between items-center mb-4">
                        <h3 className="text-lg sm:text-xl font-bold">{t.createProject}</h3>
                        <button onClick={() => setShowProjectForm(false)} className="p-2 hover:bg-slate-100 rounded-lg">
                          <i data-lucide="x-circle" className="w-6 h-6"></i>
                        </button>
                      </div>
                      
                      <div className="space-y-4">
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-1">{t.projectName}</label>
                          <input
                            type="text"
                            value={newProject.name}
                            onChange={(e) => setNewProject({...newProject, name: e.target.value})}
                            className="w-full px-4 py-3 border border-slate-300 rounded-lg text-base"
                            placeholder="Solar System Repair"
                          />
                        </div>
                        
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-1">{t.projectNameHe}</label>
                          <input
                            type="text"
                            value={newProject.nameHe}
                            onChange={(e) => setNewProject({...newProject, nameHe: e.target.value})}
                            className="w-full px-4 py-3 border border-slate-300 rounded-lg text-base"
                            placeholder="תיקון מערכת סולארית"
                          />
                        </div>
                        
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-sm font-medium text-slate-700 mb-1">{t.totalAmount}</label>
                            <input
                              type="number"
                              value={newProject.total}
                              onChange={(e) => setNewProject({...newProject, total: e.target.value})}
                              className="w-full px-4 py-3 border border-slate-300 rounded-lg text-base"
                              placeholder="5000"
                            />
                            {newProject.total && (
                              <p className="text-xs text-slate-500 mt-1">
                                ${(parseFloat(newProject.total) / 16).toFixed(2)} {t.perApartment}
                              </p>
                            )}
                          </div>
                          
                          <div>
                            <label className="block text-sm font-medium text-slate-700 mb-1">{t.dueDate}</label>
                            <input
                              type="date"
                              value={newProject.dueDate}
                              onChange={(e) => setNewProject({...newProject, dueDate: e.target.value})}
                              className="w-full px-4 py-3 border border-slate-300 rounded-lg text-base"
                            />
                          </div>
                        </div>
                        
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-1">{t.description}</label>
                          <textarea
                            value={newProject.description}
                            onChange={(e) => setNewProject({...newProject, description: e.target.value})}
                            className="w-full px-4 py-3 border border-slate-300 rounded-lg text-base"
                            rows="2"
                            placeholder="Emergency repair of rooftop solar panels"
                          />
                        </div>
                        
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-1">{t.descriptionHe}</label>
                          <textarea
                            value={newProject.descriptionHe}
                            onChange={(e) => setNewProject({...newProject, descriptionHe: e.target.value})}
                            className="w-full px-4 py-3 border border-slate-300 rounded-lg text-base"
                            rows="2"
                            placeholder="תיקון חירום של פאנלים סולאריים בגג"
                          />
                        </div>
                      </div>
                      
                      <div className="flex gap-2 mt-6">
                        <button
                          onClick={handleCreateProject}
                          className="flex-1 px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium flex items-center justify-center gap-2 transition-colors touch-manipulation"
                        >
                          <i data-lucide="save" className="w-5 h-5"></i>
                          {t.create}
                        </button>
                        <button
                          onClick={() => setShowProjectForm(false)}
                          className="flex-1 px-4 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg font-medium transition-colors touch-manipulation"
                        >
                          {t.cancel}
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* Monthly Settings Modal */}
                {showMonthlySettings && (
                  <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-lg p-4 sm:p-6 w-full max-w-md">
                      <div className="flex justify-between items-center mb-4">
                        <h3 className="text-lg sm:text-xl font-bold">{t.editMonthly}</h3>
                        <button onClick={() => setShowMonthlySettings(false)} className="p-2 hover:bg-slate-100 rounded-lg">
                          <i data-lucide="x-circle" className="w-6 h-6"></i>
                        </button>
                      </div>
                      
                      <div className="space-y-4">
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-1">{t.monthlyAmount}</label>
                          <input
                            type="number"
                            value={monthlySettings.amount}
                            onChange={(e) => setMonthlySettings({...monthlySettings, amount: parseFloat(e.target.value)})}
                            className="w-full px-4 py-3 border border-slate-300 rounded-lg text-base"
                          />
                        </div>
                        
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-1">{t.dueDayOfMonth}</label>
                          <input
                            type="number"
                            min="1"
                            max="31"
                            value={monthlySettings.dueDay}
                            onChange={(e) => setMonthlySettings({...monthlySettings, dueDay: parseInt(e.target.value)})}
                            className="w-full px-4 py-3 border border-slate-300 rounded-lg text-base"
                          />
                        </div>
                      </div>
                      
                      <div className="flex gap-2 mt-6">
                        <button
                          onClick={handleSaveMonthlySettings}
                          className="flex-1 px-4 py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium flex items-center justify-center gap-2 transition-colors touch-manipulation"
                        >
                          <i data-lucide="save" className="w-5 h-5"></i>
                          {t.save}
                        </button>
                        <button
                          onClick={() => setShowMonthlySettings(false)}
                          className="flex-1 px-4 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg font-medium transition-colors touch-manipulation"
                        >
                          {t.cancel}
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* Manager Settings Modal */}
                {showManagerSettings && userRole === 'admin' && (
                  <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-lg p-4 sm:p-6 w-full max-w-md">
                      <div className="flex justify-between items-center mb-4">
                        <h3 className="text-lg sm:text-xl font-bold">{t.manageManagers}</h3>
                        <button onClick={() => setShowManagerSettings(false)} className="p-2 hover:bg-slate-100 rounded-lg">
                          <i data-lucide="x-circle" className="w-6 h-6"></i>
                        </button>
                      </div>
                      
                      <div className="mb-4 p-3 bg-slate-100 rounded-lg">
                        <p className="text-sm text-slate-600">{t.currentManager}:</p>
                        <p className="font-semibold text-slate-800">{data.settings.currentManager}</p>
                      </div>
                      
                      <div className="space-y-4">
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-1">{t.newManager}</label>
                          <input
                            type="email"
                            value={managerSettings.newManagerEmail}
                            onChange={(e) => setManagerSettings({...managerSettings, newManagerEmail: e.target.value})}
                            className="w-full px-4 py-3 border border-slate-300 rounded-lg text-base"
                            placeholder="manager@building.com"
                          />
                        </div>
                        
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-1">{t.newPassword}</label>
                          <input
                            type="text"
                            value={managerSettings.newManagerPassword}
                            onChange={(e) => setManagerSettings({...managerSettings, newManagerPassword: e.target.value})}
                            className="w-full px-4 py-3 border border-slate-300 rounded-lg text-base"
                            placeholder="manager123"
                          />
                          <p className="text-xs text-slate-500 mt-1">Password will be shown to you only once</p>
                        </div>
                      </div>
                      
                      <div className="flex gap-2 mt-6">
                        <button
                          onClick={handleAssignManager}
                          className="flex-1 px-4 py-3 bg-orange-600 hover:bg-orange-700 text-white rounded-lg font-medium flex items-center justify-center gap-2 transition-colors touch-manipulation"
                        >
                          <i data-lucide="user" className="w-5 h-5"></i>
                          {t.assignManager}
                        </button>
                        <button
                          onClick={() => setShowManagerSettings(false)}
                          className="flex-1 px-4 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg font-medium transition-colors touch-manipulation"
                        >
                          {t.cancel}
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* Monthly Bills Section */}
                <div className="bg-white rounded-lg shadow-lg p-3 sm:p-6 mb-4 sm:mb-6">
                  <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-4 gap-2">
                    <h2 className="text-xl sm:text-2xl font-bold text-slate-800">{t.monthlyBills}</h2>
                    {daysUntilDue < 0 ? (
                      <div className="flex items-center gap-2 text-red-600 font-semibold text-sm sm:text-base">
                        <i data-lucide="alert-circle" className="w-5 h-5"></i>
                        {Math.abs(daysUntilDue)} {t.daysOverdue}
                      </div>
                    ) : daysUntilDue <= 3 ? (
                      <div className="flex items-center gap-2 text-orange-600 font-semibold text-sm sm:text-base">
                        <i data-lucide="clock" className="w-5 h-5"></i>
                        {daysUntilDue} {t.daysUntilDue}
                      </div>
                    ) : null}
                  </div>

                  <div className="mb-4 sm:mb-6">
                    <div className="flex justify-between items-center mb-2 text-xs sm:text-sm">
                      <span className="font-medium text-slate-600">
                        {t.progress}: {monthlyProgress.paid}/{monthlyProgress.total} ({monthlyProgress.percentage}%)
                      </span>
                      <span className="font-medium text-slate-600">
                        ${monthlyProgress.paid * currentMonthData.amount} / ${monthlyProgress.total * currentMonthData.amount}
                      </span>
                    </div>
                    <div className="h-3 bg-slate-200 rounded-full overflow-hidden">
                      <div
                        className="h-full bg-gradient-to-r from-green-500 to-green-600 transition-all duration-500"
                        style={{ width: `${monthlyProgress.percentage}%` }}
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-2 sm:gap-3">
                    {Object.entries(currentMonthData.apartments).map(([num, apt]) => (
                      <div
                        key={num}
                        onClick={() => isAuthenticated && togglePaymentStatus('monthly', null, num)}
                        className={`p-3 sm:p-4 rounded-lg border-2 transition-all touch-manipulation ${
                          apt.paid
                            ? 'bg-green-50 border-green-500 active:bg-green-100'
                            : daysUntilDue < 0
                            ? 'bg-red-50 border-red-500 active:bg-red-100'
                            : 'bg-slate-50 border-slate-300 active:bg-slate-100'
                        } ${isAuthenticated ? 'cursor-pointer' : ''}`}
                      >
                        <div className="text-center">
                          <div className="text-base sm:text-lg font-bold text-slate-700 mb-1 sm:mb-2">
                            {t.apartment} {num}
                          </div>
                          <div className="flex justify-center mb-1 sm:mb-2">
                            {apt.paid ? (
                              <i data-lucide="check" className="w-5 h-5 text-green-600"></i>
                            ) : daysUntilDue < 0 ? (
                              <i data-lucide="x" className="w-5 h-5 text-red-600"></i>
                            ) : (
                              <i data-lucide="clock" className="w-5 h-5 text-orange-500"></i>
                            )}
                          </div>
                          <div className={`text-xs font-semibold ${
                            apt.paid ? 'text-green-700' : daysUntilDue < 0 ? 'text-red-700' : 'text-orange-600'
                          }`}>
                            {apt.paid ? t.paid : daysUntilDue < 0 ? t.overdue : t.unpaid}
                          </div>
                          {apt.paid && apt.date && (
                            <div className="text-xs text-slate-500 mt-1">
                              {new Date(apt.date).toLocaleDateString(language === 'he' ? 'he-IL' : 'en-US', {
                                month: 'short',
                                day: 'numeric'
                              })}
                            </div>
                          )}
                          <div className="text-xs sm:text-sm font-semibold text-slate-600 mt-1">
                            ${apt.amount || currentMonthData.amount}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Special Projects */}
                {data.projects.map(project => {
                  const projectProgress = calculateProgress(project.apartments);
                  const projectDaysUntil = getProjectDaysUntilDue(project.dueDate);
                  
                  return (
                    <div key={project.id} className="bg-white rounded-lg shadow-lg p-3 sm:p-6 mb-4 sm:mb-6">
                      <div className="mb-4">
                        <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-2 gap-2">
                          <div className="flex-1">
                            <div className="flex items-center gap-2">
                              <h2 className="text-xl sm:text-2xl font-bold text-slate-800">
                                {language === 'he' ? project.nameHe : project.name}
                              </h2>
                              {isAuthenticated && (
                                <button
                                  onClick={() => handleDeleteProject(project.id)}
                                  className="p-1 hover:bg-red-100 rounded text-red-600 touch-manipulation"
                                >
                                  <i data-lucide="trash-2" className="w-5 h-5"></i>
                                </button>
                              )}
                            </div>
                          </div>
                          {projectDaysUntil < 0 ? (
                            <div className="flex items-center gap-2 text-red-600 font-semibold text-sm sm:text-base">
                              <i data-lucide="alert-circle" className="w-5 h-5"></i>
                              {Math.abs(projectDaysUntil)} {t.daysOverdue}
                            </div>
                          ) : projectDaysUntil <= 7 ? (
                            <div className="flex items-center gap-2 text-orange-600 font-semibold text-sm sm:text-base">
                              <i data-lucide="clock" className="w-5 h-5"></i>
                              {projectDaysUntil} {t.daysUntilDue}
                            </div>
                          ) : null}
                        </div>
                        <p className="text-sm sm:text-base text-slate-600 mb-2">
                          {language === 'he' ? project.descriptionHe : project.description}
                        </p>
                        <div className="flex flex-wrap gap-2 sm:gap-4 text-xs sm:text-sm">
                          <span className="text-slate-600">
                            <strong>{t.total}:</strong> ${project.total.toLocaleString()}
                          </span>
                          <span className="text-slate-600">
                            <strong>${project.perApartment}</strong> {t.perApartment}
                          </span>
                          <span className="text-slate-600">
                            <strong>{t.dueDate}:</strong> {new Date(project.dueDate).toLocaleDateString(language === 'he' ? 'he-IL' : 'en-US')}
                          </span>
                        </div>
                      </div>

                      <div className="mb-4 sm:mb-6">
                        <div className="flex justify-between items-center mb-2 text-xs sm:text-sm">
                          <span className="font-medium text-slate-600">
                            {t.progress}: {projectProgress.paid}/{projectProgress.total} ({projectProgress.percentage}%)
                          </span>
                          <span className="font-medium text-slate-600">
                            ${(projectProgress.paid * project.perApartment).toLocaleString()} / ${project.total.toLocaleString()}
                          </span>
                        </div>
                        <div className="h-3 bg-slate-200 rounded-full overflow-hidden">
                          <div
                            className="h-full bg-gradient-to-r from-blue-500 to-blue-600 transition-all duration-500"
                            style={{ width: `${projectProgress.percentage}%` }}
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-2 sm:gap-3">
                        {Object.entries(project.apartments).map(([num, apt]) => (
                          <div
                            key={num}
                            onClick={() => isAuthenticated && togglePaymentStatus('project', project.id, num)}
                            className={`p-3 sm:p-4 rounded-lg border-2 transition-all touch-manipulation ${
                              apt.paid
                                ? 'bg-blue-50 border-blue-500 active:bg-blue-100'
                                : projectDaysUntil < 0
                                ? 'bg-red-50 border-red-500 active:bg-red-100'
                                : 'bg-slate-50 border-slate-300 active:bg-slate-100'
                            } ${isAuthenticated ? 'cursor-pointer' : ''}`}
                          >
                            <div className="text-center">
                              <div className="text-base sm:text-lg font-bold text-slate-700 mb-1 sm:mb-2">
                                {t.apartment} {num}
                              </div>
                              <div className="flex justify-center mb-1 sm:mb-2">
                                {apt.paid ? (
                                  <i data-lucide="check" className="w-5 h-5 text-blue-600"></i>
                                ) : projectDaysUntil < 0 ? (
                                  <i data-lucide="x" className="w-5 h-5 text-red-600"></i>
                                ) : (
                                  <i data-lucide="clock" className="w-5 h-5 text-orange-500"></i>
                                )}
                              </div>
                              <div className={`text-xs font-semibold ${
                                apt.paid ? 'text-blue-700' : projectDaysUntil < 0 ? 'text-red-700' : 'text-orange-600'
                              }`}>
                                {apt.paid ? t.paid : projectDaysUntil < 0 ? t.overdue : t.unpaid}
                              </div>
                              {apt.paid && apt.date && (
                                <div className="text-xs text-slate-500 mt-1">
                                  {new Date(apt.date).toLocaleDateString(language === 'he' ? 'he-IL' : 'en-US', {
                                    month: 'short',
                                    day: 'numeric'
                                  })}
                                </div>
                              )}
                              <div className="text-xs sm:text-sm font-semibold text-slate-600 mt-1">
                                ${apt.amount || project.perApartment}
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}

                <div className="text-center text-xs sm:text-sm text-slate-500 mt-8 pb-4">
                  {t.lastUpdated}: {new Date().toLocaleString(language === 'he' ? 'he-IL' : 'en-US')}
                </div>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('app'));
        root.render(<PaymentTracker />);
    </script>

    <!-- React from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</body>
</html>
