<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Payment Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .rtl { direction: rtl; }
        .touch-manipulation { touch-action: manipulation; }
        * { transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1); }
        .spinner { border: 3px solid #f3f4f6; border-top: 3px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const PaymentTracker = () => {
          const [currentDate, setCurrentDate] = useState(new Date());
          const [isAuthenticated, setIsAuthenticated] = useState(false);
          const [userRole, setUserRole] = useState(null);
          const [showLogin, setShowLogin] = useState(false);
          const [password, setPassword] = useState('');
          const [language, setLanguage] = useState('en');
          const [showAdminPanel, setShowAdminPanel] = useState(false);
          const [showProjectForm, setShowProjectForm] = useState(false);
          const [showMonthlySettings, setShowMonthlySettings] = useState(false);
          const [showManagerSettings, setShowManagerSettings] = useState(false);
          const [loading, setLoading] = useState(true);
          const [saving, setSaving] = useState(false);
          const [error, setError] = useState(null);
          const [newProject, setNewProject] = useState({ name: '', nameHe: '', total: '', dueDate: '', description: '', descriptionHe: '' });
          const [monthlySettings, setMonthlySettings] = useState({ amount: 150, dueDay: 5 });
          const [managerSettings, setManagerSettings] = useState({ newManagerEmail: '', newManagerPassword: '' });
          const [data, setData] = useState(null);
          const [fileSha, setFileSha] = useState(null);

          const texts = {
            en: { title: 'Building Payment Tracker', login: 'Manager Login', logout: 'Logout', adminPanel: 'Admin Panel', managerPanel: 'Manager Panel', monthlyBills: 'Monthly Bills', specialProjects: 'Special Projects', apartment: 'Apt', paid: 'PAID', unpaid: 'DUE', overdue: 'OVERDUE', progress: 'Progress', total: 'Total', perApartment: 'per apartment', dueDate: 'Due Date', lastUpdated: 'Last updated', password: 'Password', submit: 'Submit', cancel: 'Cancel', save: 'Save', delete: 'Delete', edit: 'Edit', create: 'Create', close: 'Close', daysOverdue: 'days overdue', daysUntilDue: 'days until due', createProject: 'Create Special Project', editMonthly: 'Edit Monthly Bills', manageManagers: 'Manage Managers', projectName: 'Project Name', projectNameHe: 'Project Name (Hebrew)', totalAmount: 'Total Amount', description: 'Description', descriptionHe: 'Description (Hebrew)', monthlyAmount: 'Monthly Amount per Apartment', dueDayOfMonth: 'Due Day of Month', currentManager: 'Current Manager', newManager: 'New Manager Email', newPassword: 'New Manager Password', assignManager: 'Assign New Manager', fillAllFields: 'Please fill all fields', projectCreated: 'Project created!', settingsSaved: 'Settings saved!', managerAssigned: 'Manager assigned!', confirmDelete: 'Delete this project?', loading: 'Loading...', saving: 'Saving...', errorLoading: 'Error loading data', errorSaving: 'Error saving data' },
            he: { title: 'מעקב תשלומים', login: 'כניסה', logout: 'יציאה', adminPanel: 'ניהול', managerPanel: 'מנהל', monthlyBills: 'חשבונות חודשיים', specialProjects: 'פרויקטים', apartment: 'דירה', paid: 'שולם', unpaid: 'לא שולם', overdue: 'באיחור', progress: 'התקדמות', total: 'סה״כ', perApartment: 'לדירה', dueDate: 'תאריך', lastUpdated: 'עודכן', password: 'סיסמה', submit: 'אישור', cancel: 'ביטול', save: 'שמור', delete: 'מחק', edit: 'ערוך', create: 'צור', close: 'סגור', daysOverdue: 'ימים באיחור', daysUntilDue: 'ימים', createProject: 'פרויקט חדש', editMonthly: 'ערוך חודשי', manageManagers: 'מנהלים', projectName: 'שם', projectNameHe: 'שם עברית', totalAmount: 'סכום', description: 'תיאור', descriptionHe: 'תיאור עברית', monthlyAmount: 'סכום חודשי', dueDayOfMonth: 'יום תשלום', currentManager: 'מנהל נוכחי', newManager: 'מנהל חדש', newPassword: 'סיסמה', assignManager: 'הקצה', fillAllFields: 'מלא שדות', projectCreated: 'נוצר!', settingsSaved: 'נשמר!', managerAssigned: 'הוקצה!', confirmDelete: 'למחוק?', loading: 'טוען...', saving: 'שומר...', errorLoading: 'שגיאה', errorSaving: 'שגיאה' }
          };
          const t = texts[language];

 // NO MORE TOKEN IN CODE!

const loadDataFromGitHub = async () => {
  try {
    setLoading(true);
    setError(null);
    
    const response = await fetch('/.netlify/functions/github-api', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'read' })
    });
    
    if (!response.ok) throw new Error('Load failed');
    
    const result = await response.json();
    const content = JSON.parse(atob(result.content));
    
    setData(content);
    setFileSha(result.sha);
    setLoading(false);
  } catch (err) {
    console.error('Load error:', err);
    setError(t.errorLoading);
    setLoading(false);
  }
};

const saveDataToGitHub = async (newData) => {
  try {
    setSaving(true);
    const content = btoa(JSON.stringify(newData, null, 2));
    
    const response = await fetch('/.netlify/functions/github-api', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        action: 'write', 
        content: content, 
        sha: fileSha 
      })
    });
    
    if (!response.ok) throw new Error('Save failed');
    
    const result = await response.json();
    setFileSha(result.content.sha);
    setSaving(false);
    return true;
  } catch (err) {
    console.error('Save error:', err);
    alert(t.errorSaving);
    setSaving(false);
    return false;
  }
};
          useEffect(() => { loadDataFromGitHub(); }, []);
          useEffect(() => { lucide.createIcons(); });

          const getCurrentMonthKey = () => `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}`;
          const formatMonthYear = (dateStr) => new Date(dateStr.split('-')[0], parseInt(dateStr.split('-')[1]) - 1).toLocaleDateString(language === 'he' ? 'he-IL' : 'en-US', { month: 'long', year: 'numeric' });
          const changeMonth = (dir) => { const d = new Date(currentDate); d.setMonth(d.getMonth() + dir); setCurrentDate(d); };
          const getDaysUntilDue = (day) => Math.ceil((new Date(new Date().getFullYear(), new Date().getMonth(), day) - new Date()) / 86400000);
          const getProjectDaysUntilDue = (date) => Math.ceil((new Date(date) - new Date()) / 86400000);
          const calculateProgress = (apts) => { const t = Object.keys(apts).length; const p = Object.values(apts).filter(a => a.paid).length; return { paid: p, total: t, percentage: Math.round((p / t) * 100) }; };

          const handleLogin = () => {
            if (password === data.settings.adminPassword) { setUserRole('admin'); setIsAuthenticated(true); setShowLogin(false); setPassword(''); }
            else if (password === data.settings.managerPassword) { setUserRole('manager'); setIsAuthenticated(true); setShowLogin(false); setPassword(''); }
            else alert('Invalid password');
          };

          const togglePaymentStatus = async (type, id, num) => {
            if (!isAuthenticated) return;
            const newData = { ...data };
            if (type === 'monthly') {
              const m = getCurrentMonthKey();
              if (!newData.monthlyBills[m]) newData.monthlyBills[m] = { amount: monthlySettings.amount, dueDay: monthlySettings.dueDay, apartments: Object.fromEntries([...Array(16)].map((_, i) => [(i + 1).toString(), { paid: false }])) };
              const s = newData.monthlyBills[m].apartments[num].paid;
              newData.monthlyBills[m].apartments[num] = { paid: !s, date: !s ? new Date().toISOString().split('T')[0] : undefined, amount: newData.monthlyBills[m].amount };
            } else {
              const p = newData.projects.find(p => p.id === id);
              const s = p.apartments[num].paid;
              p.apartments[num] = { paid: !s, date: !s ? new Date().toISOString().split('T')[0] : undefined, amount: p.perApartment };
            }
            setData(newData);
            await saveDataToGitHub(newData);
          };

          const handleCreateProject = async () => {
            if (!newProject.name || !newProject.total || !newProject.dueDate) { alert(t.fillAllFields); return; }
            const total = parseFloat(newProject.total);
            const proj = { id: `p-${Date.now()}`, name: newProject.name, nameHe: newProject.nameHe || newProject.name, total, perApartment: Math.round((total / 16) * 100) / 100, dueDate: newProject.dueDate, description: newProject.description || '', descriptionHe: newProject.descriptionHe || '', apartments: Object.fromEntries([...Array(16)].map((_, i) => [(i + 1).toString(), { paid: false }])) };
            const newData = { ...data, projects: [...data.projects, proj] };
            setData(newData);
            if (await saveDataToGitHub(newData)) { setNewProject({ name: '', nameHe: '', total: '', dueDate: '', description: '', descriptionHe: '' }); setShowProjectForm(false); alert(t.projectCreated); }
          };

          const handleDeleteProject = async (id) => { if (window.confirm(t.confirmDelete)) { const newData = { ...data, projects: data.projects.filter(p => p.id !== id) }; setData(newData); await saveDataToGitHub(newData); } };

          const handleSaveMonthlySettings = async () => {
            const m = getCurrentMonthKey();
            const newData = { ...data };
            if (!newData.monthlyBills[m]) newData.monthlyBills[m] = { amount: monthlySettings.amount, dueDay: monthlySettings.dueDay, apartments: Object.fromEntries([...Array(16)].map((_, i) => [(i + 1).toString(), { paid: false }])) };
            else { newData.monthlyBills[m].amount = monthlySettings.amount; newData.monthlyBills[m].dueDay = monthlySettings.dueDay; }
            setData(newData);
            if (await saveDataToGitHub(newData)) { setShowMonthlySettings(false); alert(t.settingsSaved); }
          };

          const handleAssignManager = async () => {
            if (!managerSettings.newManagerEmail || !managerSettings.newManagerPassword) { alert(t.fillAllFields); return; }
            const newData = { ...data, settings: { ...data.settings, currentManager: managerSettings.newManagerEmail, managerPassword: managerSettings.newManagerPassword } };
            setData(newData);
            if (await saveDataToGitHub(newData)) { setManagerSettings({ newManagerEmail: '', newManagerPassword: '' }); setShowManagerSettings(false); alert(t.managerAssigned); }
          };

          if (loading) return (<div className="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 flex items-center justify-center"><div className="text-center"><div className="spinner mx-auto mb-4"></div><p className="text-slate-600 text-lg">{t.loading}</p></div></div>);
          if (error) return (<div className="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 flex items-center justify-center p-4"><div className="bg-white rounded-lg shadow-lg p-6 max-w-md text-center"><i data-lucide="alert-circle" className="w-16 h-16 text-red-500 mx-auto mb-4"></i><h2 className="text-xl font-bold text-slate-800 mb-2">Error</h2><p className="text-slate-600 mb-4">{error}</p><button onClick={() => window.location.reload()} className="px-4 py-2 bg-blue-600 text-white rounded-lg">Refresh</button></div></div>);
          if (!data) return null;

          const currentMonthKey = getCurrentMonthKey();
          const currentMonthData = data.monthlyBills[currentMonthKey] || { amount: monthlySettings.amount, dueDay: monthlySettings.dueDay, apartments: Object.fromEntries([...Array(16)].map((_, i) => [(i + 1).toString(), { paid: false }])) };
          const monthlyProgress = calculateProgress(currentMonthData.apartments);
          const daysUntilDue = getDaysUntilDue(currentMonthData.dueDay);

          return (
            <div className={`min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 p-2 sm:p-4 ${language === 'he' ? 'rtl' : ''}`}>
              {saving && <div className="fixed top-4 right-4 bg-blue-600 text-white px-4 py-2 rounded-lg shadow-lg z-50 flex items-center gap-2"><div className="spinner !w-4 !h-4 !border-2"></div>{t.saving}</div>}
              
              <div className="max-w-6xl mx-auto">
                <div className="bg-white rounded-lg shadow-lg p-3 sm:p-6 mb-4">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
                    <h1 className="text-xl sm:text-3xl font-bold text-slate-800">{t.title}</h1>
                    <div className="flex gap-2">
                      <button onClick={() => setLanguage(language === 'en' ? 'he' : 'en')} className="px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs sm:text-sm font-medium">{language === 'en' ? 'עברית' : 'English'}</button>
                      {isAuthenticated ? (<><button onClick={() => setShowAdminPanel(!showAdminPanel)} className="px-3 py-2 bg-purple-100 text-purple-700 rounded-lg text-xs sm:text-sm font-medium flex items-center gap-2"><i data-lucide="settings" className="w-4 h-4"></i>{userRole === 'admin' ? t.adminPanel : t.managerPanel}</button><button onClick={() => { setIsAuthenticated(false); setUserRole(null); setShowAdminPanel(false); }} className="px-3 py-2 bg-red-100 text-red-700 rounded-lg text-xs sm:text-sm font-medium">{t.logout}</button></>) : (<button onClick={() => setShowLogin(true)} className="px-3 py-2 bg-blue-600 text-white rounded-lg text-xs sm:text-sm font-medium flex items-center gap-2"><i data-lucide="lock" className="w-4 h-4"></i>{t.login}</button>)}
                    </div>
                  </div>
                  
                  {showAdminPanel && isAuthenticated && (
                    <div className="mt-4 p-4 bg-purple-50 rounded-lg border-2 border-purple-200">
                      <h3 className="text-lg font-bold text-purple-900 mb-3">{userRole === 'admin' ? t.adminPanel : t.managerPanel}</h3>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <button onClick={() => setShowProjectForm(true)} className="px-4 py-3 bg-blue-600 text-white rounded-lg font-medium flex items-center justify-center gap-2"><i data-lucide="plus" className="w-5 h-5"></i>{t.createProject}</button>
                        <button onClick={() => setShowMonthlySettings(true)} className="px-4 py-3 bg-green-600 text-white rounded-lg font-medium flex items-center justify-center gap-2"><i data-lucide="edit-2" className="w-5 h-5"></i>{t.editMonthly}</button>
                        {userRole === 'admin' && <button onClick={() => setShowManagerSettings(true)} className="px-4 py-3 bg-orange-600 text-white rounded-lg font-medium flex items-center justify-center gap-2"><i data-lucide="user" className="w-5 h-5"></i>{t.manageManagers}</button>}
                      </div>
                    </div>
                  )}
                  
                  <div className="flex items-center justify-center gap-4 mt-4">
                    <button onClick={() => changeMonth(-1)} className="p-2 hover:bg-slate-100 rounded-lg"><i data-lucide="chevron-left" className="w-6 h-6"></i></button>
                    <h2 className="text-base sm:text-xl font-semibold text-slate-700 min-w-[180px] text-center">{formatMonthYear(currentMonthKey)}</h2>
                    <button onClick={() => changeMonth(1)} className="p-2 hover:bg-slate-100 rounded-lg"><i data-lucide="chevron-right" className="w-6 h-6"></i></button>
                  </div>
                </div>

                {showLogin && (
                  <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-lg p-4 sm:p-6 w-full max-w-md">
                      <h3 className="text-lg font-bold mb-4">{t.login}</h3>
                      <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleLogin()} placeholder={t.password} className="w-full px-4 py-3 border rounded-lg mb-4" />
                      <div className="flex gap-2">
                        <button onClick={handleLogin} className="flex-1 px-4 py-3 bg-blue-600 text-white rounded-lg font-medium">{t.submit}</button>
                        <button onClick={() => { setShowLogin(false); setPassword(''); }} className="flex-1 px-4 py-3 bg-slate-200 rounded-lg font-medium">{t.cancel}</button>
                      </div>
                      <p className="text-xs text-slate-500 mt-4">admin123 or manager123</p>
                    </div>
                  </div>
                )}

                {showProjectForm && (
                  <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4 overflow-y-auto">
                    <div className="bg-white rounded-lg p-4 sm:p-6 w-full max-w-2xl my-8">
                      <div className="flex justify-between items-center mb-4">
                        <h3 className="text-lg font-bold">{t.createProject}</h3>
                        <button onClick={() => setShowProjectForm(false)} className="p-2 hover:bg-slate-100 rounded-lg"><i data-lucide="x-circle" className="w-6 h-6"></i></button>
                      </div>
                      <div className="space-y-4">
                        <div><label className="block text-sm font-medium mb-1">{t.projectName}</label><input type="text" value={newProject.name} onChange={(e) => setNewProject({...newProject, name: e.target.value})} className="w-full px-4 py-3 border rounded-lg" /></div>
                        <div><label className="block text-sm font-medium mb-1">{t.projectNameHe}</label><input type="text" value={newProject.nameHe} onChange={(e) => setNewProject({...newProject, nameHe: e.target.value})} className="w-full px-4 py-3 border rounded-lg" /></div>
                        <div className="grid grid-cols-2 gap-4">
                          <div><label className="block text-sm font-medium mb-1">{t.totalAmount}</label><input type="number" value={newProject.total} onChange={(e) => setNewProject({...newProject, total: e.target.value})} className="w-full px-4 py-3 border rounded-lg" />{newProject.total && <p className="text-xs text-slate-500 mt-1">${(parseFloat(newProject.total) / 16).toFixed(2)} {t.perApartment}</p>}</div>
                          <div><label className="block text-sm font-medium mb-1">{t.dueDate}</label><input type="date" value={newProject.dueDate} onChange={(e) => setNewProject({...newProject, dueDate: e.target.value})} className="w-full px-4 py-3 border rounded-lg" /></div>
                        </div>
                        <div><label className="block text-sm font-medium mb-1">{t.description}</label><textarea value={newProject.description} onChange={(e) => setNewProject({...newProject, description: e.target.value})} className="w-full px-4 py-3 border rounded-lg" rows="2" /></div>
                        <div><label className="block text-sm font-medium mb-1">{t.descriptionHe}</label><textarea value={newProject.descriptionHe} onChange={(e) => setNewProject({...newProject, descriptionHe: e.target.value})} className="w-full px-4 py-3 border rounded-lg" rows="2" /></div>
                      </div>
                      <div className="flex gap-2 mt-6">
                        <button onClick={handleCreateProject} disabled={saving} className="flex-1 px-4 py-3 bg-blue-600 text-white rounded-lg font-medium flex items-center justify-center gap-2 disabled:opacity-50"><i data-lucide="save" className="w-5 h-5"></i>{t.create}</button>
                        <button onClick={() => setShowProjectForm(false)} className="flex-1 px-4 py-3 bg-slate-200 rounded-lg font-medium">{t.cancel}</button>
                      </div>
                    </div>
                  </div>
                )}

                {showMonthlySettings && (
                  <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-lg p-4 sm:p-6 w-full max-w-md">
                      <div className="flex justify-between items-center mb-4">
                        <h3 className="text-lg font-bold">{t.editMonthly}</h3>
                        <button onClick={() => setShowMonthlySettings(false)} className="p-2 hover:bg-slate-100 rounded-lg"><i data-lucide="x-circle" className="w-6 h-6"></i></button>
                      </div>
                      <div className="space-y-4">
                        <div><label className="block text-sm font-medium mb-1">{t.monthlyAmount}</label><input type="number" value={monthlySettings.amount} onChange={(e) => setMonthlySettings({...monthlySettings, amount: parseFloat(e.target.value)})} className="w-full px-4 py-3 border rounded-lg" /></div>
                        <div><label className="block text-sm font-medium mb-1">{t.dueDayOfMonth}</label><input type="number" min="1" max="31" value={monthlySettings.dueDay} onChange={(e) => setMonthlySettings({...monthlySettings, dueDay: parseInt(e.target.value)})} className="w-full px-4 py-3 border rounded-lg" /></div>
                      </div>
                      <div className="flex gap-2 mt-6">
                        <button onClick={handleSaveMonthlySettings} disabled={saving} className="flex-1 px-4 py-3 bg-green-600 text-white rounded-lg font-medium flex items-center justify-center gap-2 disabled:opacity-50"><i data-lucide="save" className="w-5 h-5"></i>{t.save}</button>
                        <button onClick={() => setShowMonthlySettings(false)} className="flex-1 px-4 py-3 bg-slate-200 rounded-lg font-medium">{t.cancel}</button>
                      </div>
                    </div>
                  </div>
                )}

                {showManagerSettings && userRole === 'admin' && (
                  <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-lg p-4 sm:p-6 w-full max-w-md">
                      <div className="flex justify-between items-center mb-4">
                        <h3 className="text-lg font-bold">{t.manageManagers}</h3>
                        <button onClick={() => setShowManagerSettings(false)} className="p-2 hover:bg-slate-100 rounded-lg"><i data-lucide="x-circle" className="w-6 h-6"></i></button>
                      </div>
                      <div className="mb-4 p-3 bg-slate-100 rounded-lg">
                        <p className="text-sm text-slate-600">{t.currentManager}:</p>
                        <p className="font-semibold">{data.settings.currentManager}</p>
                      </div>
                      <div className="space-y-4">
                        <div><label className="block text-sm font-medium mb-1">{t.newManager}</label><input type="email" value={managerSettings.newManagerEmail} onChange={(e) => setManagerSettings({...managerSettings, newManagerEmail: e.target.value})} className="w-full px-4 py-3 border rounded-lg" /></div>
                        <div><label className="block text-sm font-medium mb-1">{t.newPassword}</label><input type="text" value={managerSettings.newManagerPassword} onChange={(e) => setManagerSettings({...managerSettings, newManagerPassword: e.target.value})} className="w-full px-4 py-3 border rounded-lg" /></div>
                      </div>
                      <div className="flex gap-2 mt-6">
                        <button onClick={handleAssignManager} disabled={saving} className="flex-1 px-4 py-3 bg-orange-600 text-white rounded-lg font-medium flex items-center justify-center gap-2 disabled:opacity-50"><i data-lucide="user" className="w-5 h-5"></i>{t.assignManager}</button>
                        <button onClick={() => setShowManagerSettings(false)} className="flex-1 px-4 py-3 bg-slate-200 rounded-lg font-medium">{t.cancel}</button>
                      </div>
                    </div>
                  </div>
                )}

                <div className="bg-white rounded-lg shadow-lg p-3 sm:p-6 mb-4">
                  <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-4 gap-2">
                    <h2 className="text-xl sm:text-2xl font-bold">{t.monthlyBills}</h2>
                    {daysUntilDue < 0 ? <div className="flex items-center gap-2 text-red-600 font-semibold"><i data-lucide="alert-circle" className="w-5 h-5"></i>{Math.abs(daysUntilDue)} {t.daysOverdue}</div> : daysUntilDue <= 3 ? <div className="flex items-center gap-2 text-orange-600 font-semibold"><i data-lucide="clock" className="w-5 h-5"></i>{daysUntilDue} {t.daysUntilDue}</div> : null}
                  </div>
                  <div className="mb-4">
                    <div className="flex justify-between items-center mb-2 text-xs sm:text-sm">
                      <span>{t.progress}: {monthlyProgress.paid}/{monthlyProgress.total} ({monthlyProgress.percentage}%)</span>
                      <span>${monthlyProgress.paid * currentMonthData.amount} / ${monthlyProgress.total * currentMonthData.amount}</span>
                    </div>
                    <div className="h-3 bg-slate-200 rounded-full overflow-hidden"><div className="h-full bg-gradient-to-r from-green-500 to-green-600 transition-all duration-500" style={{ width: `${monthlyProgress.percentage}%` }}></div></div>
                  </div>
                  <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-2">
                    {Object.entries(currentMonthData.apartments).map(([num, apt]) => (
                      <div key={num} onClick={() => isAuthenticated && togglePaymentStatus('monthly', null, num)} className={`p-3 sm:p-4 rounded-lg border-2 transition-all ${apt.paid ? 'bg-green-50 border-green-500' : daysUntilDue < 0 ? 'bg-red-50 border-red-500' : 'bg-slate-50 border-slate-300'} ${isAuthenticated ? 'cursor-pointer' : ''}`}>
                        <div className="text-center">
                          <div className="text-base sm:text-lg font-bold mb-1">{t.apartment} {num}</div>
                          <div className="flex justify-center mb-1">{apt.paid ? <i data-lucide="check" className="w-5 h-5 text-green-600"></i> : daysUntilDue < 0 ? <i data-lucide="x" className="w-5 h-5 text-red-600"></i> : <i data-lucide="clock" className="w-5 h-5 text-orange-500"></i>}</div>
                          <div className={`text-xs font-semibold ${apt.paid ? 'text-green-700' : daysUntilDue < 0 ? 'text-red-700' : 'text-orange-600'}`}>{apt.paid ? t.paid : daysUntilDue < 0 ? t.overdue : t.unpaid}</div>
                          {apt.paid && apt.date && <div className="text-xs text-slate-500 mt-1">{new Date(apt.date).toLocaleDateString(language === 'he' ? 'he-IL' : 'en-US', { month: 'short', day: 'numeric' })}</div>}
                          <div className="text-xs sm:text-sm font-semibold text-slate-600 mt-1">${apt.amount || currentMonthData.amount}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {data.projects.map(project => {
                  const projectProgress = calculateProgress(project.apartments);
                  const projectDaysUntil = getProjectDaysUntilDue(project.dueDate);
                  return (
                    <div key={project.id} className="bg-white rounded-lg shadow-lg p-3 sm:p-6 mb-4">
                      <div className="mb-4">
                        <div className="flex items-center justify-between mb-2">
                          <div className="flex items-center gap-2">
                            <h2 className="text-xl sm:text-2xl font-bold">{language === 'he' ? project.nameHe : project.name}</h2>
                            {isAuthenticated && <button onClick={() => handleDeleteProject(project.id)} className="p-1 hover:bg-red-100 rounded text-red-600"><i data-lucide="trash-2" className="w-5 h-5"></i></button>}
                          </div>
                          {projectDaysUntil < 0 ? <div className="flex items-center gap-2 text-red-600 font-semibold"><i data-lucide="alert-circle" className="w-5 h-5"></i>{Math.abs(projectDaysUntil)} {t.daysOverdue}</div> : projectDaysUntil <= 7 ? <div className="flex items-center gap-2 text-orange-600 font-semibold"><i data-lucide="clock" className="w-5 h-5"></i>{projectDaysUntil} {t.daysUntilDue}</div> : null}
                        </div>
                        <p className="text-sm text-slate-600 mb-2">{language === 'he' ? project.descriptionHe : project.description}</p>
                        <div className="flex flex-wrap gap-2 text-xs sm:text-sm">
                          <span><strong>{t.total}:</strong> ${project.total.toLocaleString()}</span>
                          <span><strong>${project.perApartment}</strong> {t.perApartment}</span>
                          <span><strong>{t.dueDate}:</strong> {new Date(project.dueDate).toLocaleDateString(language === 'he' ? 'he-IL' : 'en-US')}</span>
                        </div>
                      </div>
                      <div className="mb-4">
                        <div className="flex justify-between items-center mb-2 text-xs sm:text-sm">
                          <span>{t.progress}: {projectProgress.paid}/{projectProgress.total} ({projectProgress.percentage}%)</span>
                          <span>${(projectProgress.paid * project.perApartment).toLocaleString()} / ${project.total.toLocaleString()}</span>
                        </div>
                        <div className="h-3 bg-slate-200 rounded-full overflow-hidden"><div className="h-full bg-gradient-to-r from-blue-500 to-blue-600 transition-all duration-500" style={{ width: `${projectProgress.percentage}%` }}></div></div>
                      </div>
                      <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-2">
                        {Object.entries(project.apartments).map(([num, apt]) => (
                          <div key={num} onClick={() => isAuthenticated && togglePaymentStatus('project', project.id, num)} className={`p-3 sm:p-4 rounded-lg border-2 transition-all ${apt.paid ? 'bg-blue-50 border-blue-500' : projectDaysUntil < 0 ? 'bg-red-50 border-red-500' : 'bg-slate-50 border-slate-300'} ${isAuthenticated ? 'cursor-pointer' : ''}`}>
                            <div className="text-center">
                              <div className="text-base sm:text-lg font-bold mb-1">{t.apartment} {num}</div>
                              <div className="flex justify-center mb-1">{apt.paid ? <i data-lucide="check" className="w-5 h-5 text-blue-600"></i> : projectDaysUntil < 0 ? <i data-lucide="x" className="w-5 h-5 text-red-600"></i> : <i data-lucide="clock" className="w-5 h-5 text-orange-500"></i>}</div>
                              <div className={`text-xs font-semibold ${apt.paid ? 'text-blue-700' : projectDaysUntil < 0 ? 'text-red-700' : 'text-orange-600'}`}>{apt.paid ? t.paid : projectDaysUntil < 0 ? t.overdue : t.unpaid}</div>
                              {apt.paid && apt.date && <div className="text-xs text-slate-500 mt-1">{new Date(apt.date).toLocaleDateString(language === 'he' ? 'he-IL' : 'en-US', { month: 'short', day: 'numeric' })}</div>}
                              <div className="text-xs sm:text-sm font-semibold text-slate-600 mt-1">${apt.amount || project.perApartment}</div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}

                <div className="text-center text-xs sm:text-sm text-slate-500 mt-8 pb-4">{t.lastUpdated}: {new Date().toLocaleString(language === 'he' ? 'he-IL' : 'en-US')}</div>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('app'));
        root.render(<PaymentTracker />);
    </script>
</body>
</html>
